version: 2
updates:
  # Security updates are event-driven (a new advisory triggers a scan), so no
  # schedule, cooldown or open-pull-requests-limit here can delay them:
  # cooldown is version-updates-only, and security PRs neither count towards
  # nor are capped by the version-update PR limit. What CAN silently block a
  # security PR is repo settings (Dependabot security updates / grouped
  # security updates / auto-triage rules) or an `ignore` rule — ignore rules
  # apply to security updates too, so none may be added for shipped deps.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      # Version updates only; security fixes do not wait for this schedule.
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      # npm security fixes arrive as two grouped PRs split by declared
      # dependency type, so a burst of advisories lands as two reviewable
      # changes: production first (triage priority — what ships), development
      # second (test/build tooling). The split also halves the group-blocking
      # trade-off: one failing update holds back only its own group, and there
      # is no native ungroup — split a PR manually when a critical is blocked.
      # Exact pins in package.json do not block security updates: Dependabot
      # bumps the pin to the minimum patched version. The type is the
      # package.json declaration: since #3073 moved the vitest packages to
      # devDependencies, test tooling groups as development automatically.
      security-production:
        applies-to: security-updates
        dependency-type: production
        patterns:
          - '*'
      security-development:
        applies-to: security-updates
        dependency-type: development
        patterns:
          - '*'
      nextjs:
        applies-to: version-updates
        patterns:
          - next
          - '@next/*'
      react:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      vitest:
        applies-to: version-updates
        patterns:
          - vitest
          - '@vitest/*'
          - vitest-browser-react
      pubky-sdk:
        applies-to: version-updates
        patterns:
          - '@synonymdev/*'
          - pubky-app-specs
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  # The Dockerfile pins `node:lts-alpine`, a floating tag, so Dependabot has no
  # version to bump and this entry is inert until the base image is pinned by
  # version or digest (see docs/development-workflow.md, "Dependency Security").
  # Base-image freshness today comes from rebuilding the image.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
