name: Build and Publish Docker Image

on:
  push:
    tags: ['v*']

permissions:
      contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: pubky/ci-workflows/.github/actions/docker/build_and_push@main
        with:
          registry: registry-1.docker.io/synonymsoft
          context: .
          push: true
          latest: true
          tags: |
            type=ref,event=tag
          platforms: |
            linux/arm64
            linux/amd64
          image: pubky-app
          # Share the pubky-app GHA cache scope with the e2e/preview builds:
          # one image, one cache, no default-scope clobbering of other images.
          cache_from: type=gha,scope=pubky-app
          cache_to: type=gha,mode=max,scope=pubky-app,ignore-error=true
          # NEXT_PUBLIC_DB_VERSION / DB_NAME / DEBUG_MODE come from the
          # Dockerfile ARG defaults (their single source of truth).
          build_args: |
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}


