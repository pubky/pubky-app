name: VRT Update Baselines
description: Regenerates visual regression test baselines on Linux and macOS.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: Regenerate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    concurrency:
      group: vrt-update-baselines-regenerate-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Refuse master
        if: github.ref_name == 'master'
        run: |
          echo "Refusing to regenerate baselines on master. Run from dev or a feature branch." >&2
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set Playwright browsers path
        run: echo "PLAYWRIGHT_BROWSERS_PATH=${HOME}/.cache/ms-playwright" >> "$GITHUB_ENV"

      - name: Restore Playwright browsers cache
        uses: actions/cache/restore@v4
        id: playwright-browsers-cache
        with:
          path: ~/.cache/ms-playwright
          key: vrt-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            vrt-playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-browsers-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-browsers-cache.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: npx playwright install-deps chromium firefox webkit

      - name: Regenerate VRT baselines
        run: npm run test:vrt:regenerate-baseline

      - name: Save Playwright browsers cache
        if: always() && steps.playwright-browsers-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-browsers-cache.outputs.cache-primary-key }}

      - name: Stage platform baselines for upload
        run: |
          PLATFORM_SUFFIX="$([ "${{ runner.os }}" = "Linux" ] && echo linux || echo darwin)"
          STAGING="${RUNNER_TEMP}/vrt-baselines-${PLATFORM_SUFFIX}"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          find src/test/vrt -name "*-${PLATFORM_SUFFIX}.png" | while IFS= read -r file; do
            rel="${file#src/test/vrt/}"
            dest="${STAGING}/${rel}"
            mkdir -p "$(dirname "$dest")"
            cp "$file" "$dest"
          done

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v4
        with:
          name: vrt-baselines-${{ runner.os == 'Linux' && 'linux' || 'darwin' }}
          path: ${{ runner.temp }}/vrt-baselines-${{ runner.os == 'Linux' && 'linux' || 'darwin' }}
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit baselines
    needs: regenerate
    runs-on: ubuntu-latest
    concurrency:
      group: vrt-update-baselines-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Refuse master
        if: github.ref_name == 'master'
        run: |
          echo "Refusing to commit baselines on master. Run from dev or a feature branch." >&2
          exit 1

      - name: Resolve target branch
        id: target
        run: |
          SOURCE_REF="${{ github.ref_name }}"

          if [ "$SOURCE_REF" = "dev" ]; then
            echo "target_branch=vrt-update-baselines" >> "$GITHUB_OUTPUT"
            echo "open_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "target_branch=${SOURCE_REF}" >> "$GITHUB_OUTPUT"
            echo "open_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare target branch
        run: |
          SOURCE_REF="${{ github.ref_name }}"
          TARGET_BRANCH="${{ steps.target.outputs.target_branch }}"

          git fetch origin "$SOURCE_REF"

          if [ "$SOURCE_REF" = "dev" ]; then
            git checkout -B "$TARGET_BRANCH" "origin/dev"
          else
            git checkout -B "$TARGET_BRANCH" "origin/${SOURCE_REF}"
          fi

      - name: Download Linux baselines
        uses: actions/download-artifact@v4
        with:
          name: vrt-baselines-linux
          path: ${{ runner.temp }}/vrt-baselines-linux

      - name: Download macOS baselines
        uses: actions/download-artifact@v4
        with:
          name: vrt-baselines-darwin
          path: ${{ runner.temp }}/vrt-baselines-darwin

      - name: Overlay baselines
        run: |
          rsync -a "${{ runner.temp }}/vrt-baselines-linux/" src/test/vrt/
          rsync -a "${{ runner.temp }}/vrt-baselines-darwin/" src/test/vrt/

      - name: Commit and push baselines
        run: |
          TARGET_BRANCH="${{ steps.target.outputs.target_branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find src/test/vrt -path '*/__screenshots__/*.png' -print0 | xargs -0 git add

          if git diff --staged --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi

          git commit -m "test(vrt): regenerate baselines"
          git push -u origin "$TARGET_BRANCH"

      - name: Open pull request
        if: steps.target.outputs.open_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr list --head vrt-update-baselines --base dev --state open --json number --jq '.[0].number' | grep -q .; then
            echo "An open PR from vrt-update-baselines to dev already exists."
            exit 0
          fi

          gh pr create \
            --base dev \
            --head vrt-update-baselines \
            --title "test(vrt): regenerate baselines" \
            --body "$(cat <<'EOF'
