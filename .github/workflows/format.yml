name: Code Quality

on:
  merge_group:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - '**' # Run on PRs targeting any branch
  # Enable manual trigger
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Check Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Blobless partial clone. The negation drops only VRT baseline PNGs
          # under src/test/vrt/**/__screenshots__. VRT workflows still fetch them.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/src/test/vrt/**/__screenshots__

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck
