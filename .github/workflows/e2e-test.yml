# Cypress end-to-end tests against a freshly built pubky-stack + pubky-app.
#
# Pushes to master/dev always run every spec in `default_specs` below.
#
# Manual runs (workflow_dispatch) accept an optional `specs` input to run only
# a subset, one matrix job per spec. Handy for exercising just the specs a PR
# touches without spinning up the stack locally:
#
#   gh workflow run e2e-test.yml --ref <branch> -f specs=onboarding.cy.ts
#   gh workflow run e2e-test.yml --ref <branch> -f specs=onboarding.cy.ts,feed.cy.ts
#
# `specs` is a comma-separated list of file names from cypress/e2e/ (whitespace
# around names is ignored, and newlines also work as separators, so
# `-F specs=@file` with one name per line is fine). Leave it empty to run the
# full default list. Names
# that are not in `default_specs` fail the run in the `resolve_specs` job,
# before any docker image work starts. The default list lives only in
# `default_specs`, so add new spec files there.
#
# GitHub hides workflow_dispatch check runs from the pull request checks list,
# so manual runs also report a commit status per spec (`e2e-test / chrome /
# <spec>`) on the commit that was tested. That status shows in the checks list
# of any open PR for the branch. Push runs skip this: the commit already shows
# the Actions check runs.
name: e2e-test
run-name: ${{ inputs.specs && format('e2e-test ({0})', inputs.specs) || '' }}
env:
  pubky_stack_ref: 'staging'
  platforms: 'linux/amd64'
  registry: 'europe-west6-docker.pkg.dev/infra-464608/synonym-private-repo'
  # Single source of truth for the specs the e2e-test matrix runs.
  default_specs: 'contacts.cy.ts,feed.cy.ts,notifications.cy.ts,onboarding.cy.ts,posts.cy.ts,profile.cy.ts,search.cy.ts,settings.cy.ts,collections.cy.ts'

on:
  workflow_dispatch:
    inputs:
      specs:
        description: 'Comma-separated Cypress spec files to run (e.g. onboarding.cy.ts,feed.cy.ts). Empty runs all specs.'
        required: false
        default: ''
        type: string
  push:
    branches:
      - master
      - dev

jobs:
  resolve_specs:
    name: Resolve Cypress specs
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.resolve.outputs.specs }}
    steps:
      - name: Build spec matrix from input
        id: resolve
        env:
          DEFAULT_SPECS: ${{ env.default_specs }}
          REQUESTED_SPECS: ${{ inputs.specs }}
        run: |
          set -euo pipefail

          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }

          IFS=',' read -r -a defaults <<< "$DEFAULT_SPECS"

          selected=()
          if [ -z "$(trim "$REQUESTED_SPECS")" ]; then
            echo "No specs input given; running the full default list."
            selected=("${defaults[@]}")
          else
            # Treat newlines as separators. `read` below only consumes the first
            # line, and the runner parses `::cmd::` at the start of any echoed
            # line, so strip them before splitting or echoing the input.
            REQUESTED_SPECS="${REQUESTED_SPECS//[$'\r\n']/,}"
            IFS=',' read -r -a requested <<< "$REQUESTED_SPECS"
            unknown=()
            for raw in "${requested[@]}"; do
              spec="$(trim "$raw")"
              [ -z "$spec" ] && continue
              known=false
              for candidate in "${defaults[@]}"; do
                [ "$spec" = "$candidate" ] && known=true && break
              done
              if [ "$known" != true ]; then
                unknown+=("$spec")
                continue
              fi
              duplicate=false
              for existing in "${selected[@]}"; do
                [ "$spec" = "$existing" ] && duplicate=true && break
              done
              [ "$duplicate" = true ] || selected+=("$spec")
            done

            if [ "${#unknown[@]}" -gt 0 ]; then
              echo "::error::Unknown spec(s) in 'specs' input: ${unknown[*]}. Valid specs: ${defaults[*]}"
              exit 1
            fi
            if [ "${#selected[@]}" -eq 0 ]; then
              echo "::error::'specs' input '$REQUESTED_SPECS' resolved to no specs. Valid specs: ${defaults[*]}"
              exit 1
            fi
          fi

          specs_json="$(printf '%s\n' "${selected[@]}" | jq -R . | jq -c -s .)"
          echo "Running specs: ${selected[*]}"
          echo "specs=$specs_json" >> "$GITHUB_OUTPUT"

  rebuild_images:
    name: Getting images to rebuild
    runs-on: ubuntu-latest
    needs: [resolve_specs]
    outputs:
      homeserver-testnet_tag: ${{ steps.set_tag.outputs.homeserver-testnet_tag }}
      pubky-nexus_tag: ${{ steps.set_tag.outputs.pubky-nexus_tag }}
    strategy:
      matrix:
        include:
          - app: "pubky-nexus"
            submodule_dir: "pubky-stack/pubky-nexus/"
            image: "pubky-nexus"

          - app: "homeserver"
            submodule_dir: "pubky-stack/pubky-homeserver/"
            image: "homeserver-testnet"

    steps:
      - name: Checkout pubky-stack
        uses: actions/checkout@v4
        with:
          repository: pubky/pubky-stack
          ref: ${{ env.pubky_stack_ref }}
          path: pubky-stack
          submodules: true
          token: ${{ secrets.READ_REPOS }}
          # cannot use ssh-key (deploy key) for private submodules due to the
          # limitation where only a single key can be used per repo checkout
          # see https://github.com/actions/checkout/issues/183

      - name: Set HEAD commit hash
        id: sha_tag
        uses: pubky/ci-workflows/.github/actions/docker/get_head_commit_hash@e6d3b38b5ebfa97b86595cb44f3a86695e473b09 # v1.0.0
        with:
          path: ${{ matrix.submodule_dir }}

      - name: Set Current Tag as Output
        id: set_tag
        run: |
          echo ${{ matrix.image }}_tag=${{ steps.sha_tag.outputs.hash }} >> $GITHUB_OUTPUT

      - name: Login to registry
        uses: pubky/ci-workflows/.github/actions/docker/registry_login@e6d3b38b5ebfa97b86595cb44f3a86695e473b09 # v1.0.0
        with:
          registry: ${{ env.registry }}
          gcp_service_account_key: ${{ secrets.GCR_JSON_KEY }}

      - name: Check if image needs to be rebuild
        uses: pubky/ci-workflows/.github/actions/docker/check_if_image_exists@e6d3b38b5ebfa97b86595cb44f3a86695e473b09 # v1.0.0
        id: check_image
        with:
          image: ${{ env.registry }}/${{ matrix.image }}
          tag: ${{ steps.sha_tag.outputs.hash }}
          arch: ${{ env.platforms }}

      - name: Rebuild the images if needed
        uses: pubky/ci-workflows/.github/actions/docker/build_and_push@e6d3b38b5ebfa97b86595cb44f3a86695e473b09 # v1.0.0
        with:
          registry: ${{ env.registry }}
          image: ${{ matrix.image }}
          context: ${{ matrix.submodule_dir }}
          platforms: ${{ env.platforms }}
        if: ${{ steps.check_image.outputs.exists != 'true' }}

  set_vars_pubky_app:
    name: Set vars for Pubky App
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set_vars.outputs.env }}
      platforms: ${{ steps.set_vars.outputs.platforms }}
    steps:
      - name: Set Vars
        id: set_vars
        run: |
          echo platforms=${{ env.platforms }} >> $GITHUB_OUTPUT

  rebuild_pubky_app:
    needs: [ resolve_specs, set_vars_pubky_app ]
    uses: ./.github/workflows/build-docker-image.yml
    with:
      platforms: ${{ needs.set_vars_pubky_app.outputs.platforms }}
    secrets: inherit

  e2e-test:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [resolve_specs, rebuild_images, rebuild_pubky_app]
    env:
      HOMESERVER_TAG: ${{ needs.rebuild_images.outputs.homeserver-testnet_tag }}
      PUBKY_APP_TAG: ${{ needs.rebuild_pubky_app.outputs.image_tag }}
      PUBKY_NEXUS_TAG: ${{ needs.rebuild_images.outputs.pubky-nexus_tag }}
      # Commit status context reported on manual runs (see header comment).
      STATUS_CONTEXT: e2e-test / ${{ matrix.browser }} / ${{ matrix.spec }}
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome]
        spec: ${{ fromJSON(needs.resolve_specs.outputs.specs) }}

    steps:
      - name: Report pending commit status
        if: github.event_name == 'workflow_dispatch'
        # Reporting must never decide the outcome of the tests it reports on.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --silent --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description="Running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Validate envs from rebuild_images job
        run: |
          if [ -z "${{ env.HOMESERVER_TAG }}" ]; then
            echo "Error: env HOMESERVER_TAG is empty!"
            exit 1
          fi

          if [ -z "${{ env.PUBKY_APP_TAG }}" ]; then
            echo "Error: env PUBKY_APP_TAG is empty!"
            exit 1
          fi

          if [ -z "${{ env.PUBKY_NEXUS_TAG }}" ]; then
            echo "Error: env PUBKY_NEXUS_TAG is empty!"
            exit 1
          fi

      - name: Checkout pubky-stack
        uses: actions/checkout@v4
        with:
          repository: pubky/pubky-stack
          ref: ${{ env.pubky_stack_ref }}
          path: pubky-stack
          submodules: true
          token: ${{ secrets.READ_REPOS }}
          # cannot use ssh-key (deploy key) for private submodules due to the
          # limitation where only a single key can be used per repo checkout
          # see https://github.com/actions/checkout/issues/183

      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: pubky-app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'pubky-app/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'pubky-app/package-lock.json'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            pubky-app/node_modules
            pubky-app/.next/cache
          key: ${{ runner.os }}-node-${{ hashFiles('pubky-app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Cypress dependencies
        working-directory: pubky-app
        run: npm ci

      - name: Login to registry
        uses: pubky/ci-workflows/.github/actions/docker/registry_login@e6d3b38b5ebfa97b86595cb44f3a86695e473b09 # v1.0.0
        with:
          registry: ${{ env.registry }}
          gcp_service_account_key: ${{ secrets.GCR_JSON_KEY }}

      - name: Modify neo4j.env
        working-directory: pubky-stack/docker
        run: |
          sed -i 's/NEO4J_server_memory_pagecache_size=2G/NEO4J_server_memory_pagecache_size=1G/' neo4j.env
          sed -i 's/NEO4J_server_memory_heap_initial__size=4G/NEO4J_server_memory_heap_initial__size=1G/' neo4j.env
          sed -i 's/NEO4J_server_memory_heap_max__size=8G/NEO4J_server_memory_heap_max__size=2G/' neo4j.env

      - name: Increase watcher sleep in Nexus config
        working-directory: pubky-stack/docker
        run: |
          sed -i 's/watcher_sleep = 100/watcher_sleep = 500/' pubky-nexus-config-testnet.toml

      - name: Prepare pubky-stack .env
        working-directory: pubky-stack/docker
        run: |
          cp .env-sample .env

      - name: Run pubky-stack
        working-directory: pubky-stack/docker
        run: docker compose up -d --no-build homeserver nexusd nexus-neo4j nexus-redis pubky-app postgres
        env:
          REGISTRY: ${{ env.registry }}

      - name: Wait for dockerised pubky-stack to start
        run: |
          PORT=8080
          MAX_WAIT=300     # Maximum wait time in seconds (5 minutes)
          WAIT_INTERVAL=5  # Interval between checks in seconds
          ELAPSED=0

          while ! curl -s http://localhost:$PORT; do
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "Service did not start within 5 minutes."
              exit 1
            fi
            echo "Waiting for service on port $PORT to be ready... ($ELAPSED seconds elapsed)"
            sleep $WAIT_INTERVAL
            ELAPSED=$((ELAPSED + WAIT_INTERVAL))
          done

          echo "Service is ready."

      # TEMP WORKAROUND: nexusd does not create the RediSearch `postContentIdx` index at
      # startup (only via `nexusd db migration run`), so full-text post search returns 500
      # ("No such index postContentIdx") on a fresh stack. Run the migrations once after the
      # stack is up. The migration CLI ignores `--config-dir` and reads
      # ~/.pubky-nexus/migrations/config.toml, which defaults to localhost, so write a config
      # pointing at the compose service hostnames first. Remove once Nexus creates the index
      # on startup.
      - name: Run Nexus DB migrations (create postContentIdx)
        run: |
          docker exec nexusd sh -c 'mkdir -p /root/.pubky-nexus/migrations && cat > /root/.pubky-nexus/migrations/config.toml <<EOF
          backfill_ready = []

          [stack]
          log_level = "info"
          files_path = "/static/files/"

          [stack.otlp]
          name = "nexusd.migration"

          [stack.db]
          redis = "redis://nexus-redis:6379"

          [stack.db.neo4j]
          uri = "bolt://nexus-neo4j:7687"
          password = "12345678"
          EOF'
          docker exec nexusd nexusd db migration run
          docker exec nexus-redis redis-cli FT._LIST | grep -q postContentIdx || {
            echo "Error: postContentIdx was not created by Nexus migrations"
            exit 1
          }

      - name: Run e2e tests - Desktop (${{ matrix.browser }}) - Spec (${{matrix.spec}})
        id: test-desktop
        uses: cypress-io/github-action@v6
        env:
          DEBUG: '@cypress/github-action'
        with:
          working-directory: pubky-app/cypress
          config-file: cypress.config.ts
          spec: e2e/${{ matrix.spec }}
          browser: ${{ matrix.browser }}
          headed: false
          summary-title: ${{ matrix.browser }} - Desktop
          install: false
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 180

      - name: Report commit status
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.test-desktop.outcome }}
        run: |
          case "$TEST_OUTCOME" in
            success) state=success; description="Passed" ;;
            failure) state=failure; description="Failed" ;;
            *)       state=error;   description="Did not run (setup failed or cancelled)" ;;
          esac
          gh api --silent --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Upload screenshots - ${{ matrix.browser }} - Desktop
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}-${{ matrix.spec }}-desktop
          path: pubky-app/cypress/screenshots
          if-no-files-found: ignore

      - name: Upload video for ${{ matrix.spec }} test - ${{ matrix.browser }} - Desktop
        if: always() && steps.test-desktop.outcome == 'failure'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: video-${{ matrix.browser }}-${{ matrix.spec }}-desktop-onboarding
          path: pubky-app/cypress/videos/${{ matrix.spec }}.mp4
          if-no-files-found: ignore

      # TODO: Skipped due to bug https://github.com/pubky/pubky-app/issues/372
      # - name: Run e2e tests - Mobile (${{ matrix.browser }})
      #   id: test-mobile
      #   uses: cypress-io/github-action@v6
      #   env:
      #     DEBUG: '@cypress/github-action'
      #   with:
      #     working-directory: pubky-app/cypress
      #     config-file: cypress.config.mobile.ts
      #     spec: e2e/**/*.cy.ts
      #     browser: ${{ matrix.browser }}
      #     headed: false
      #     summary-title: ${{ matrix.browser }} - Mobile
      #     install: false
      #     # no need to start the server, it's already running
      #     wait-on: 'http://localhost:3000'
      #     wait-on-timeout: 180

      - name: Upload screenshots - ${{ matrix.browser }} - Mobile
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}-${{ matrix.spec }}-mobile
          path: pubky-app/cypress/screenshots/mobile
          if-no-files-found: ignore

      - name: Upload video for ${{ matrix.spec }} test - ${{ matrix.browser }} - Mobile
        if: always() && steps.test-mobile.outcome == 'failure'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: video-${{ matrix.browser }}-${{ matrix.spec }}-mobile-onboarding
          path: pubky-app/cypress/videos/mobile/${{ matrix.spec }}.mp4
          if-no-files-found: ignore

      - name: Upload cypress.log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cypress-log-${{ matrix.browser }}-${{ matrix.spec }}
          path: pubky-app/cypress/cypress.log
          if-no-files-found: ignore

      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v2
