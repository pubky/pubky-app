name: e2e-test
env:
  pubky_stack_ref: 'staging'
  platforms: 'linux/amd64'
  registry: 'europe-west6-docker.pkg.dev/infra-464608/synonym-private-repo'

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Viewport(s) to run the specs against'
        type: choice
        options:
          - desktop
          - mobile
          - both
        default: desktop
      browsers:
        description: 'chrome runs the specs for the chosen target; firefox and webkit run the desktop cross-browser smoke subset and ignore target (webkit runs on macOS against a stack on Ubuntu)'
        type: choice
        options:
          - chrome
          - firefox
          - webkit
        default: chrome
  push:
    branches:
      - master
      - dev
    # Run on everything except a short exclude list of paths that can change
    # neither the app image nor the specs, so a new input triggers the suite
    # by default (running too often is the safe failure). Same list as
    # .github/scripts/docker-content-tag.sh, minus cypress/ (specs must run).
    # Later patterns win, so the last two re-include the workflows this suite
    # and its image build consume.
    paths:
      - '**'
      # Covered by '**'; listed because both feed the spec jobs' npm ci
      # (patch-package) and the node_modules cache key.
      - 'patches/**'
      - '.npmrc'
      - '!docs/**'
      - '!.agents/**'
      - '!.claude/**'
      - '!.codex/**'
      - '!.cursor/**'
      - '!.greptile/**'
      - '!**/*.md'
      - '!.github/workflows/**'
      - '.github/workflows/e2e-test.yml'
      - '.github/workflows/build-docker-image.yml'
  schedule:
    # All on the default branch (dev), Monday to Friday, i.e. Sunday to Thursday night, so results
    # are ready on week-day mornings. 03:00 UTC: Chrome mobile. 04:00 UTC: the Firefox desktop
    # smoke subset; the matrix below keys on this exact cron string. 05:00 UTC: the same subset on
    # WebKit on macOS; the job conditions below key on that exact cron string.
    - cron: '0 3 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '0 5 * * 1-5'

jobs:
  rebuild_images:
    name: Getting images to rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      homeserver-testnet_tag: ${{ steps.set_tag.outputs.homeserver-testnet_tag }}
      pubky-nexus_tag: ${{ steps.set_tag.outputs.pubky-nexus_tag }}
    strategy:
      matrix:
        include:
          - app: "pubky-nexus"
            submodule_dir: "pubky-stack/pubky-nexus/"
            image: "pubky-nexus"

          - app: "homeserver"
            submodule_dir: "pubky-stack/pubky-homeserver/"
            image: "homeserver-testnet"
            build_args: |
              BUILD_TARGET=testnet


    steps:
      - name: Checkout pubky-stack
        uses: actions/checkout@v7
        with:
          repository: pubky/pubky-stack
          ref: ${{ env.pubky_stack_ref }}
          path: pubky-stack
          submodules: true
          token: ${{ secrets.READ_REPOS }}
          # cannot use ssh-key (deploy key) for private submodules due to the
          # limitation where only a single key can be used per repo checkout
          # see https://github.com/actions/checkout/issues/183

      - name: Set HEAD commit hash
        id: sha_tag
        uses: pubky/ci-workflows/.github/actions/docker/get_head_commit_hash@main
        with:
          path: ${{ matrix.submodule_dir }}

      - name: Set Current Tag as Output
        id: set_tag
        run: |
          echo ${{ matrix.image }}_tag=${{ steps.sha_tag.outputs.hash }} >> $GITHUB_OUTPUT

      - name: Login to registry
        uses: pubky/ci-workflows/.github/actions/docker/registry_login@main
        with:
          registry: ${{ env.registry }}
          gcp_service_account_key: ${{ secrets.GCR_JSON_KEY }}

      - name: Check if image needs to be rebuild
        uses: pubky/ci-workflows/.github/actions/docker/check_if_image_exists@main
        id: check_image
        with:
          image: ${{ env.registry }}/${{ matrix.image }}
          tag: ${{ steps.sha_tag.outputs.hash }}
          arch: ${{ env.platforms }}

      - name: Rebuild the images if needed
        uses: pubky/ci-workflows/.github/actions/docker/build_and_push@main
        with:
          registry: ${{ env.registry }}
          image: ${{ matrix.image }}
          cache_from: type=gha,scope=${{ matrix.image }}
          cache_to: type=gha,mode=max,scope=${{ matrix.image }}
          context: ${{ matrix.submodule_dir }}
          platforms: ${{ env.platforms }}
          build_args: ${{ matrix.build_args }}
        if: ${{ steps.check_image.outputs.exists != 'true' }}

  rebuild_pubky_app:
    # WebKit runs build the app on macOS (webkit-test) and never pull this image.
    if: ${{ github.event.schedule != '0 5 * * 1-5' && inputs.browsers != 'webkit' }}
    uses: ./.github/workflows/build-docker-image.yml
    with:
      # The env context is not available in a reusable-call `with`, so the
      # platform is a literal here (matches the env.platforms value).
      platforms: linux/amd64
      # Content-hash tag: skip the build entirely when no Docker build input
      # changed since the last e2e build.
      tag_mode: content
    secrets: inherit

  e2e-test:
    name: End-to-End Tests
    # WebKit runs (05:00 nightly or a webkit dispatch) use the webkit-stack and webkit-test pair below.
    if: ${{ github.event.schedule != '0 5 * * 1-5' && inputs.browsers != 'webkit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Intentionally not needs: rebuild_pubky_app. The spec jobs do their own
    # setup (checkout, npm ci, infra services) while the app image is still
    # building, then poll the registry for it (see the wait step below), so
    # setup overlaps the build instead of starting after it.
    needs: [rebuild_images]
    env:
      HOMESERVER_TAG: ${{ needs.rebuild_images.outputs.homeserver-testnet_tag }}
      PUBKY_NEXUS_TAG: ${{ needs.rebuild_images.outputs.pubky-nexus_tag }}
    permissions:
      contents: read
      statuses: write
      # read the app build job's status for a fast-fail while polling the image
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Cross-browser runs (04:00 nightly or a firefox dispatch) are desktop only and run a
        # smoke subset of whole specs on the browser-sensitive paths: sign-up, backup file download
        # and restore, clipboard (onboarding), post and article image uploads (posts), and profile
        # edit forms, tags and a stubbed homeserver failure (profile). Every spec signs up a fresh
        # user first. Firefox ships on the ubuntu runner image.
        # Every other run is Chrome: the 03:00 nightly is mobile only, and push runs have no inputs,
        # so they resolve to desktop only.
        browser: ${{ fromJSON((github.event.schedule == '0 4 * * 1-5' || inputs.browsers == 'firefox') && '["firefox"]' || '["chrome"]') }}
        viewport: ${{ fromJSON((github.event.schedule == '0 4 * * 1-5' || inputs.browsers == 'firefox') && '["desktop"]' || github.event_name == 'schedule' && '["mobile"]' || inputs.target == 'both' && '["desktop","mobile"]' || format('["{0}"]', inputs.target || 'desktop')) }}
        spec: ${{ fromJSON((github.event.schedule == '0 4 * * 1-5' || inputs.browsers == 'firefox') && '["onboarding.cy.ts","posts.cy.ts","profile.cy.ts"]' || '["contacts.cy.ts","feed.cy.ts","notifications.cy.ts","onboarding.cy.ts","posts.cy.ts","profile.cy.ts","search.cy.ts","settings.cy.ts","collections.cy.ts","pagination.cy.ts","collections-pagination.cy.ts","deep-links.cy.ts","locks.cy.ts"]') }}
        # Phones run a smoke subset: the `itMobile` tests (cypress/support/mobile.ts). These specs
        # have none, because every phone-only path they reach is covered by the specs that remain.
        exclude:
          - viewport: mobile
            spec: contacts.cy.ts
          - viewport: mobile
            spec: onboarding.cy.ts
          - viewport: mobile
            spec: collections.cy.ts
          - viewport: mobile
            spec: collections-pagination.cy.ts
          - viewport: mobile
            spec: locks.cy.ts

    steps:
      - name: Validate envs from rebuild_images job
        run: |
          if [ -z "${{ env.HOMESERVER_TAG }}" ]; then
            echo "Error: env HOMESERVER_TAG is empty!"
            exit 1
          fi

          if [ -z "${{ env.PUBKY_NEXUS_TAG }}" ]; then
            echo "Error: env PUBKY_NEXUS_TAG is empty!"
            exit 1
          fi

      - name: Checkout pubky-stack
        uses: actions/checkout@v7
        with:
          repository: pubky/pubky-stack
          ref: ${{ env.pubky_stack_ref }}
          path: pubky-stack
          submodules: true
          token: ${{ secrets.READ_REPOS }}
          # cannot use ssh-key (deploy key) for private submodules due to the
          # limitation where only a single key can be used per repo checkout
          # see https://github.com/actions/checkout/issues/183

      - name: Checkout this repository
        uses: actions/checkout@v7
        with:
          path: pubky-app
          # Blobless partial clone. The negation drops only VRT baseline PNGs
          # under src/test/vrt/**/__screenshots__. VRT workflows still fetch them.
          # git ls-tree (docker-content-tag.sh) still sees every blob id, so the
          # content tag does not change.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/src/test/vrt/**/__screenshots__

      - name: Resolve the pubky-app image tag
        id: app_tag
        working-directory: pubky-app
        run: |
          # Content hash of every input the Docker build can consume; single
          # implementation shared with build-docker-image.yml (tag_mode: content).
          echo "content_tag=$(bash .github/scripts/docker-content-tag.sh '${{ env.platforms }}')" >> $GITHUB_OUTPUT

      # The Cypress binary lives outside node_modules; cache it alongside so a hit
      # can skip `npm ci` (which is what downloads it) entirely.
      - name: Restore node_modules cache
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            pubky-app/node_modules
            ~/.cache/Cypress
          # `v2` is the cache format (v2 caches a verified Cypress binary). `.npmrc` matches
          # nothing until the file exists.
          key: e2e-node-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubky-app/.nvmrc', 'pubky-app/package.json', 'pubky-app/package-lock.json', 'pubky-app/.npmrc', 'pubky-app/patches/*.patch') }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'pubky-app/.nvmrc'
          cache: ${{ steps.node-modules.outputs.cache-hit != 'true' && 'npm' || '' }}
          cache-dependency-path: 'pubky-app/package-lock.json'

      - name: Install Cypress dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: pubky-app
        run: npm ci

      # Verifying writes `verified: true` beside the binary, so jobs that restore the cache skip the
      # first-launch smoke test. Here it runs before the stack starts, on an idle runner.
      - name: Verify the Cypress binary
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: pubky-app
        run: npx --no-install cypress verify
        env:
          CYPRESS_VERIFY_TIMEOUT: 120000

      - name: Save node_modules cache
        if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            pubky-app/node_modules
            ~/.cache/Cypress
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - name: Login to registry
        uses: pubky/ci-workflows/.github/actions/docker/registry_login@main
        with:
          registry: ${{ env.registry }}
          gcp_service_account_key: ${{ secrets.GCR_JSON_KEY }}

      - name: Modify neo4j.env
        working-directory: pubky-stack/docker
        run: |
          sed -i 's/NEO4J_server_memory_pagecache_size=2G/NEO4J_server_memory_pagecache_size=1G/' neo4j.env
          sed -i 's/NEO4J_server_memory_heap_initial__size=4G/NEO4J_server_memory_heap_initial__size=1G/' neo4j.env
          sed -i 's/NEO4J_server_memory_heap_max__size=8G/NEO4J_server_memory_heap_max__size=2G/' neo4j.env

      - name: Increase watcher sleep in Nexus config
        working-directory: pubky-stack/docker
        run: |
          sed -i 's/watcher_sleep = 100/watcher_sleep = 500/' pubky-nexus-config-testnet.toml

      - name: Prepare pubky-stack .env
        working-directory: pubky-stack/docker
        run: |
          cp .env-sample .env
          printf '\nPUBKY_RUNTIME_SHOP_URL=%s\n' 'https://shop.staging.pubky.app/marketplace' >> .env
          # Poll Nexus for notifications more often than the 8888ms app default so
          # specs do not sit on multi-second poll ticks between actions (E2E stack
          # only). Set on the pubky-app service alone via a compose override, which
          # compose merges automatically. Fail loudly rather than clobber an
          # override file if the stack ever ships one.
          if [ -f docker-compose.override.yml ]; then
            echo 'docker-compose.override.yml already exists in pubky-stack; merge the PUBKY_RUNTIME_* poll interval into it instead of overwriting.'
            exit 1
          fi
          cat > docker-compose.override.yml <<'EOF'
          services:
            pubky-app:
              environment:
                PUBKY_RUNTIME_NOTIFICATION_POLL_INTERVAL_MS: "2000"
          EOF

      # Locks needs Pubky Ring, Bitkit and a Lock / Paykit Server, none of which run in CI: the Locks
      # spec alone runs the app against a stubbed Lock Server (see the script and locks.cy.ts).
      - name: Enable the stubbed Locks boundary for the Locks spec
        if: matrix.spec == 'locks.cy.ts'
        working-directory: pubky-stack/docker
        run: bash ../../pubky-app/.github/scripts/e2e-enable-locks-stub.sh

      # pubky-stack@staging pins a homeserver that defaults to signup_mode = "open".
      # Open mode rejects signup token generation, so the invite continue button stays disabled.
      - name: Require signup tokens for e2e invite codes
        working-directory: pubky-stack/docker
        run: |
          sed -i 's/signup_mode = "open"/signup_mode = "token_required"/' homeserver.config.toml
          grep -q 'signup_mode = "token_required"' homeserver.config.toml || {
            echo 'Error: homeserver.config.toml is missing signup_mode = "token_required"'
            exit 1
          }

      # Start the infra services first; pubky-app follows once its image exists.
      # Compose interpolates every service at config load, so PUBKY_APP_TAG must be
      # set here even though the pubky-app service is not started in this step.
      - name: Run pubky-stack infra services
        working-directory: pubky-stack/docker
        run: docker compose up -d --no-build homeserver nexusd nexus-neo4j nexus-redis postgres
        env:
          REGISTRY: ${{ env.registry }}
          PUBKY_APP_TAG: ${{ steps.app_tag.outputs.content_tag }}

      - name: Wait for dockerised pubky-stack to start
        run: |
          PORT=8080
          MAX_WAIT=300     # Maximum wait time in seconds (5 minutes)
          WAIT_INTERVAL=5  # Interval between checks in seconds
          ELAPSED=0

          while ! curl -s http://localhost:$PORT; do
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "Service did not start within 5 minutes."
              exit 1
            fi
            echo "Waiting for service on port $PORT to be ready... ($ELAPSED seconds elapsed)"
            sleep $WAIT_INTERVAL
            ELAPSED=$((ELAPSED + WAIT_INTERVAL))
          done

          echo "Service is ready."

      - name: Wait for the pubky-app image
        working-directory: pubky-app
        env:
          REGISTRY: ${{ env.registry }}
          GH_TOKEN: ${{ github.token }}
          CONTENT_TAG: ${{ steps.app_tag.outputs.content_tag }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: bash .github/scripts/wait-for-app-image.sh

      - name: Run pubky-app
        working-directory: pubky-stack/docker
        run: docker compose up -d --no-build pubky-app
        env:
          REGISTRY: ${{ env.registry }}
          PUBKY_APP_TAG: ${{ steps.app_tag.outputs.content_tag }}

      - name: Run e2e tests - Desktop (${{ matrix.browser }}) - Spec (${{matrix.spec}})
        id: test-desktop
        if: matrix.viewport == 'desktop'
        uses: cypress-io/github-action@v7
        env:
          DEBUG: '@cypress/github-action'
        with:
          working-directory: pubky-app/cypress
          config-file: cypress.config.ts
          spec: e2e/${{ matrix.spec }}
          browser: ${{ matrix.browser }}
          headed: false
          summary-title: ${{ matrix.browser }} - Desktop
          install: false
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 180

      - name: Upload screenshots - ${{ matrix.browser }} - Desktop
        if: always() && matrix.viewport == 'desktop'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.browser }}-${{ matrix.spec }}-desktop
          path: pubky-app/cypress/screenshots
          if-no-files-found: ignore

      - name: Upload video for ${{ matrix.spec }} test - ${{ matrix.browser }} - Desktop
        if: always() && steps.test-desktop.outcome == 'failure'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: video-${{ matrix.browser }}-${{ matrix.spec }}-desktop-onboarding
          path: pubky-app/cypress/videos/${{ matrix.spec }}.mp4
          if-no-files-found: ignore

      - name: Run e2e tests - Mobile (${{ matrix.browser }}) - Spec (${{matrix.spec}})
        id: test-mobile
        if: matrix.viewport == 'mobile'
        uses: cypress-io/github-action@v7
        env:
          DEBUG: '@cypress/github-action'
        with:
          working-directory: pubky-app/cypress
          config-file: cypress.config.mobile.ts
          spec: e2e/${{ matrix.spec }}
          browser: ${{ matrix.browser }}
          headed: false
          summary-title: ${{ matrix.browser }} - Mobile
          install: false
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 180

      - name: Upload screenshots - ${{ matrix.browser }} - Mobile
        if: always() && matrix.viewport == 'mobile'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.browser }}-${{ matrix.spec }}-mobile
          path: pubky-app/cypress/screenshots/mobile
          if-no-files-found: ignore

      - name: Upload video for ${{ matrix.spec }} test - ${{ matrix.browser }} - Mobile
        if: always() && steps.test-mobile.outcome == 'failure'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: video-${{ matrix.browser }}-${{ matrix.spec }}-mobile-onboarding
          path: pubky-app/cypress/videos/mobile/${{ matrix.spec }}.mp4
          if-no-files-found: ignore

      - name: Upload cypress.log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          # Desktop keeps its historical artifact name; mobile is suffixed so a
          # `both` dispatch does not collide on the same spec.
          name: cypress-log-${{ matrix.browser }}-${{ matrix.spec }}${{ matrix.viewport == 'mobile' && '-mobile' || '' }}
          path: pubky-app/cypress/cypress.log
          if-no-files-found: ignore

      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v2

  # WebKit runs (05:00 nightly or a webkit dispatch) need macOS for a Safari-like engine, and macOS
  # runners cannot run Docker. Each spec therefore gets a pair of jobs that run at the same time:
  # this one starts the same pubky-stack as e2e-test on Ubuntu and holds it up, and webkit-test
  # runs the app and Cypress on macOS against it. .github/scripts/e2e-remote-stack.sh explains how
  # the two find and reach each other. The stack steps are copies of e2e-test's; keep them in step.
  webkit-stack:
    name: WebKit stack on Ubuntu
    if: ${{ github.event.schedule == '0 5 * * 1-5' || inputs.browsers == 'webkit' }}
    runs-on: ubuntu-latest
    # Longer than webkit-test, which may start late if macOS runners are busy: the macOS job, not
    # this one, decides how a run ends.
    timeout-minutes: 75
    needs: [rebuild_images]
    env:
      HOMESERVER_TAG: ${{ needs.rebuild_images.outputs.homeserver-testnet_tag }}
      PUBKY_NEXUS_TAG: ${{ needs.rebuild_images.outputs.pubky-nexus_tag }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      # GitHub names a matrix job "<name> (<matrix values>)".
      PEER_JOB: WebKit specs on macOS (${{ matrix.spec }})
      CLIENT_KEY_ARTIFACT: e2e-webkit-client-key-${{ matrix.spec }}-${{ github.run_attempt }}
      ENDPOINT_ARTIFACT: e2e-webkit-stack-endpoint-${{ matrix.spec }}-${{ github.run_attempt }}
    permissions:
      contents: read
      # read the macOS job's state and download its artifact
      actions: read
    strategy:
      fail-fast: false
      matrix:
        spec: ['onboarding.cy.ts', 'posts.cy.ts', 'profile.cy.ts']

    steps:
      - name: Validate envs from rebuild_images job
        run: |
          if [ -z "${{ env.HOMESERVER_TAG }}" ]; then
            echo "Error: env HOMESERVER_TAG is empty!"
            exit 1
          fi

          if [ -z "${{ env.PUBKY_NEXUS_TAG }}" ]; then
            echo "Error: env PUBKY_NEXUS_TAG is empty!"
            exit 1
          fi

      - name: Checkout pubky-stack
        uses: actions/checkout@v7
        with:
          repository: pubky/pubky-stack
          ref: ${{ env.pubky_stack_ref }}
          path: pubky-stack
          submodules: true
          token: ${{ secrets.READ_REPOS }}

      # Only the scripts: this job runs no app code.
      - name: Checkout this repository
        uses: actions/checkout@v7
        with:
          path: pubky-app
          sparse-checkout: .github/scripts

      - name: Login to registry
        uses: pubky/ci-workflows/.github/actions/docker/registry_login@main
        with:
          registry: ${{ env.registry }}
          gcp_service_account_key: ${{ secrets.GCR_JSON_KEY }}

      - name: Modify neo4j.env
        working-directory: pubky-stack/docker
        run: |
          sed -i 's/NEO4J_server_memory_pagecache_size=2G/NEO4J_server_memory_pagecache_size=1G/' neo4j.env
          sed -i 's/NEO4J_server_memory_heap_initial__size=4G/NEO4J_server_memory_heap_initial__size=1G/' neo4j.env
          sed -i 's/NEO4J_server_memory_heap_max__size=8G/NEO4J_server_memory_heap_max__size=2G/' neo4j.env

      - name: Increase watcher sleep in Nexus config
        working-directory: pubky-stack/docker
        run: |
          sed -i 's/watcher_sleep = 100/watcher_sleep = 500/' pubky-nexus-config-testnet.toml

      # The pubky-app container never starts in this job. Its compose environment is still
      # prepared as in e2e-test, because the macOS app is started with exactly that environment.
      - name: Prepare pubky-stack .env
        working-directory: pubky-stack/docker
        run: |
          cp .env-sample .env
          printf '\nPUBKY_RUNTIME_SHOP_URL=%s\n' 'https://shop.staging.pubky.app/marketplace' >> .env
          if [ -f docker-compose.override.yml ]; then
            echo 'docker-compose.override.yml already exists in pubky-stack; merge the PUBKY_RUNTIME_* poll interval into it instead of overwriting.'
            exit 1
          fi
          cat > docker-compose.override.yml <<'EOF'
          services:
            pubky-app:
              environment:
                PUBKY_RUNTIME_NOTIFICATION_POLL_INTERVAL_MS: "2000"
          EOF

      - name: Require signup tokens for e2e invite codes
        working-directory: pubky-stack/docker
        run: |
          sed -i 's/signup_mode = "open"/signup_mode = "token_required"/' homeserver.config.toml
          grep -q 'signup_mode = "token_required"' homeserver.config.toml || {
            echo 'Error: homeserver.config.toml is missing signup_mode = "token_required"'
            exit 1
          }

      # Compose interpolates every service at config load, so PUBKY_APP_TAG must be set even
      # though no pubky-app image is pulled here.
      - name: Run pubky-stack infra services
        working-directory: pubky-stack/docker
        run: docker compose up -d --no-build homeserver nexusd nexus-neo4j nexus-redis postgres
        env:
          REGISTRY: ${{ env.registry }}
          PUBKY_APP_TAG: unused

      - name: Wait for dockerised pubky-stack to start
        run: |
          PORT=8080
          MAX_WAIT=300     # Maximum wait time in seconds (5 minutes)
          WAIT_INTERVAL=5  # Interval between checks in seconds
          ELAPSED=0

          while ! curl -s http://localhost:$PORT; do
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "Service did not start within 5 minutes."
              exit 1
            fi
            echo "Waiting for service on port $PORT to be ready... ($ELAPSED seconds elapsed)"
            sleep $WAIT_INTERVAL
            ELAPSED=$((ELAPSED + WAIT_INTERVAL))
          done

          echo "Service is ready."

      - name: Install cloudflared
        run: bash pubky-app/.github/scripts/e2e-remote-stack.sh install-cloudflared

      - name: Expose the stack to the macOS job
        working-directory: pubky-stack/docker
        timeout-minutes: 20
        run: bash ../../pubky-app/.github/scripts/e2e-remote-stack.sh expose
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY: ${{ env.registry }}
          PUBKY_APP_TAG: unused

      - name: Upload the stack endpoint
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ENDPOINT_ARTIFACT }}
          path: ${{ runner.temp }}/e2e-remote-stack/endpoint
          if-no-files-found: error
          retention-days: 1

      - name: Keep the stack up until the macOS job finishes
        run: bash pubky-app/.github/scripts/e2e-remote-stack.sh hold
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Close the tunnel
        if: ${{ always() }}
        run: bash pubky-app/.github/scripts/e2e-remote-stack.sh close

      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v2

  webkit-test:
    name: WebKit specs on macOS
    if: ${{ github.event.schedule == '0 5 * * 1-5' || inputs.browsers == 'webkit' }}
    runs-on: macos-latest
    timeout-minutes: 45
    # Uses none of its outputs: needing rebuild_images starts both halves together, and skips this
    # one when the stack's images cannot be resolved.
    needs: [rebuild_images]
    env:
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      # GitHub names a matrix job "<name> (<matrix values>)".
      PEER_JOB: WebKit stack on Ubuntu (${{ matrix.spec }})
      CLIENT_KEY_ARTIFACT: e2e-webkit-client-key-${{ matrix.spec }}-${{ github.run_attempt }}
      ENDPOINT_ARTIFACT: e2e-webkit-stack-endpoint-${{ matrix.spec }}-${{ github.run_attempt }}
    permissions:
      contents: read
      # read the stack job's state and download its artifact
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # The cross-browser smoke subset (see e2e-test), desktop only.
        spec: ['onboarding.cy.ts', 'posts.cy.ts', 'profile.cy.ts']

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7
        with:
          # Blobless partial clone. The negation drops only VRT baseline PNGs
          # under src/test/vrt/**/__screenshots__. VRT workflows still fetch them.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/src/test/vrt/**/__screenshots__

      # First, so the stack job has the key by the time its stack is up.
      - name: Create the tunnel key
        run: bash .github/scripts/e2e-remote-stack.sh client-key

      - name: Upload the tunnel public key
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CLIENT_KEY_ARTIFACT }}
          path: ${{ runner.temp }}/e2e-remote-stack/client-key
          if-no-files-found: error
          retention-days: 1

      # cypress-io/github-action looks for the binary in ~/.cache/Cypress on every OS unless this is
      # set, but Cypress on macOS defaults to ~/Library/Caches/Cypress. Set before npm ci, whose
      # cypress install script downloads the binary, so install, cache and run share one folder.
      - name: Set the Cypress cache folder
        run: echo "CYPRESS_CACHE_FOLDER=$HOME/.cache/Cypress" >> "$GITHUB_ENV"

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Read the Cypress and Playwright versions
        id: versions
        run: |
          echo "cypress=$(node -p "require('./package-lock.json').packages['node_modules/cypress'].version")" >> "$GITHUB_OUTPUT"
          echo "playwright=$(node -p "require('./package-lock.json').packages['node_modules/playwright-webkit'].version")" >> "$GITHUB_OUTPUT"

      # Both live outside node_modules, so the install-dependencies cache does not hold them.
      - name: Restore the Cypress binary and WebKit
        id: browsers
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.CYPRESS_CACHE_FOLDER }}
            ~/Library/Caches/ms-playwright
          key: e2e-webkit-browsers-v2-${{ runner.os }}-${{ runner.arch }}-cypress-${{ steps.versions.outputs.cypress }}-playwright-${{ steps.versions.outputs.playwright }}

      # package.json denies the playwright-webkit install script so other installs skip the download.
      # The playwright CLI shares its playwright-core version, so this is the build Cypress loads.
      - name: Install the Cypress binary and WebKit
        id: install-browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: |
          npx --no-install cypress install
          npx --no-install cypress verify
          npx --no-install playwright install webkit
        env:
          CYPRESS_VERIFY_TIMEOUT: 120000

      - name: Save the Cypress binary and WebKit
        if: steps.install-browsers.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.CYPRESS_CACHE_FOLDER }}
            ~/Library/Caches/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}

      # Cypress attaches to a browser through its own proxy, and gives up after three minutes
      # without a reason when the browser does not use it. This says in a second whether WebKit
      # does. Diagnostic for now: it reports, and the job goes on to Cypress either way.
      - name: Check that WebKit sends localhost through a proxy
        continue-on-error: true
        timeout-minutes: 5
        run: node .github/scripts/e2e-webkit-proxy-check.mjs

      # A production build like the image the other e2e jobs run, with the build arguments
      # build-docker-image.yml passes.
      - name: Build the app
        run: npm run build
        env:
          NEXT_PUBLIC_DB_VERSION: 3
          NEXT_PUBLIC_DB_NAME: franky
          NEXT_PUBLIC_DEBUG_MODE: false
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install cloudflared
        run: bash .github/scripts/e2e-remote-stack.sh install-cloudflared

      - name: Connect to the stack
        timeout-minutes: 25
        run: bash .github/scripts/e2e-remote-stack.sh connect
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Start the app
        run: bash .github/scripts/e2e-remote-stack.sh start-app

      - name: Run e2e tests - Desktop (webkit) - Spec (${{ matrix.spec }})
        id: test-desktop
        uses: cypress-io/github-action@v7
        env:
          # Temporary, to find out why WebKit does not attach on this runner; it logs every request,
          # so go back to '@cypress/github-action' once it does. cypress:electron is what makes the
          # rest appear: without it the Cypress CLI, which pipes the stderr of its server process on
          # Linux and macOS, drops the debug lines that process writes when not on a terminal.
          DEBUG: '@cypress/github-action,cypress:electron,cypress:server:browsers*,cypress:server:routes,cypress:server:server-base,pw:browser*,pw:api'
        with:
          working-directory: cypress
          config-file: cypress.config.ts
          spec: e2e/${{ matrix.spec }}
          browser: webkit
          headed: false
          summary-title: webkit (macOS) - Desktop
          install: false

      - name: Upload screenshots - webkit - Desktop
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-webkit-${{ matrix.spec }}-desktop
          path: cypress/screenshots
          if-no-files-found: ignore
          overwrite: true

      - name: Upload video for ${{ matrix.spec }} test - webkit - Desktop
        if: ${{ always() && steps.test-desktop.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: video-webkit-${{ matrix.spec }}-desktop
          path: cypress/videos/${{ matrix.spec }}.mp4
          if-no-files-found: ignore
          overwrite: true

      - name: Upload cypress.log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: cypress-log-webkit-${{ matrix.spec }}
          path: cypress/cypress.log
          if-no-files-found: ignore
          overwrite: true

      - name: Close the tunnel and print the app and tunnel logs
        if: ${{ always() }}
        run: bash .github/scripts/e2e-remote-stack.sh close
