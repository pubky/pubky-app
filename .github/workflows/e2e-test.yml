name: e2e-test
env:
  pubky_stack_ref: 'staging'
  platforms: 'linux/amd64'
  registry: 'europe-west6-docker.pkg.dev/infra-464608/synonym-private-repo'

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev
    # Skip the full suite for pushes that cannot change the app image, the
    # specs or this workflow (docs, other workflows, VRT-only changes).
    paths:
      - 'src/**'
      - 'public/**'
      - 'cypress/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'postcss.config.mjs'
      - '.nvmrc'
      - '.github/workflows/e2e-test.yml'
      - '.github/workflows/build-docker-image.yml'
      - '.github/scripts/**'
      - '!src/**/*.vrt.test.tsx'
      - '!src/**/__screenshots__/**'

# Runs group per branch, so one branch's run never cancels another's. A newer
# dev push supersedes an in-flight dev push: only the latest commit's result
# matters there. Manual dispatches get a group per run so every requested run
# executes and none is ever cancelled or replaced. Master pushes are never
# cancelled either; GitHub keeps the running run plus the newest pending one,
# so a burst of master pushes attributes coverage to the latest pending commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}

jobs:
  rebuild_images:
    name: Getting images to rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      homeserver-testnet_tag: ${{ steps.set_tag.outputs.homeserver-testnet_tag }}
      pubky-nexus_tag: ${{ steps.set_tag.outputs.pubky-nexus_tag }}
    strategy:
      matrix:
        include:
          - app: "pubky-nexus"
            submodule_dir: "pubky-stack/pubky-nexus/"
            image: "pubky-nexus"

          - app: "homeserver"
            submodule_dir: "pubky-stack/pubky-homeserver/"
            image: "homeserver-testnet"
            build_args: |
              BUILD_TARGET=testnet


    steps:
      - name: Checkout pubky-stack
        uses: actions/checkout@v7
        with:
          repository: pubky/pubky-stack
          ref: ${{ env.pubky_stack_ref }}
          path: pubky-stack
          submodules: true
          token: ${{ secrets.READ_REPOS }}
          # cannot use ssh-key (deploy key) for private submodules due to the
          # limitation where only a single key can be used per repo checkout
          # see https://github.com/actions/checkout/issues/183

      - name: Set HEAD commit hash
        id: sha_tag
        uses: pubky/ci-workflows/.github/actions/docker/get_head_commit_hash@main
        with:
          path: ${{ matrix.submodule_dir }}

      - name: Set Current Tag as Output
        id: set_tag
        run: |
          echo ${{ matrix.image }}_tag=${{ steps.sha_tag.outputs.hash }} >> $GITHUB_OUTPUT

      - name: Login to registry
        uses: pubky/ci-workflows/.github/actions/docker/registry_login@main
        with:
          registry: ${{ env.registry }}
          gcp_service_account_key: ${{ secrets.GCR_JSON_KEY }}

      - name: Check if image needs to be rebuild
        uses: pubky/ci-workflows/.github/actions/docker/check_if_image_exists@main
        id: check_image
        with:
          image: ${{ env.registry }}/${{ matrix.image }}
          tag: ${{ steps.sha_tag.outputs.hash }}
          arch: ${{ env.platforms }}

      - name: Rebuild the images if needed
        uses: pubky/ci-workflows/.github/actions/docker/build_and_push@main
        with:
          registry: ${{ env.registry }}
          image: ${{ matrix.image }}
          cache_from: type=gha,scope=${{ matrix.image }}
          cache_to: type=gha,mode=max,scope=${{ matrix.image }}
          context: ${{ matrix.submodule_dir }}
          platforms: ${{ env.platforms }}
          build_args: ${{ matrix.build_args }}
        if: ${{ steps.check_image.outputs.exists != 'true' }}

  rebuild_pubky_app:
    uses: ./.github/workflows/build-docker-image.yml
    with:
      # The env context is not available in a reusable-call `with`, so the
      # platform is a literal here (matches the env.platforms value).
      platforms: linux/amd64
      # Content-hash tag: skip the build entirely when no Docker build input
      # changed since the last e2e build.
      tag_mode: content
    secrets: inherit

  e2e-test:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Intentionally not needs: rebuild_pubky_app. The spec jobs do their own
    # setup (checkout, npm ci, infra services) while the app image is still
    # building, then poll the registry for it (see the wait step below), so
    # setup overlaps the build instead of starting after it.
    needs: [rebuild_images]
    env:
      HOMESERVER_TAG: ${{ needs.rebuild_images.outputs.homeserver-testnet_tag }}
      PUBKY_NEXUS_TAG: ${{ needs.rebuild_images.outputs.pubky-nexus_tag }}
    permissions:
      contents: read
      statuses: write
      # read the app build job's status for a fast-fail while polling the image
      actions: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome]
        spec: ["contacts.cy.ts", "feed.cy.ts", "notifications.cy.ts", "onboarding.cy.ts", "posts.cy.ts", "profile.cy.ts", "search.cy.ts", "settings.cy.ts", "collections.cy.ts"]

    steps:
      - name: Validate envs from rebuild_images job
        run: |
          if [ -z "${{ env.HOMESERVER_TAG }}" ]; then
            echo "Error: env HOMESERVER_TAG is empty!"
            exit 1
          fi

          if [ -z "${{ env.PUBKY_NEXUS_TAG }}" ]; then
            echo "Error: env PUBKY_NEXUS_TAG is empty!"
            exit 1
          fi

      - name: Checkout pubky-stack
        uses: actions/checkout@v7
        with:
          repository: pubky/pubky-stack
          ref: ${{ env.pubky_stack_ref }}
          path: pubky-stack
          submodules: true
          token: ${{ secrets.READ_REPOS }}
          # cannot use ssh-key (deploy key) for private submodules due to the
          # limitation where only a single key can be used per repo checkout
          # see https://github.com/actions/checkout/issues/183

      - name: Checkout this repository
        uses: actions/checkout@v7
        with:
          path: pubky-app

      - name: Resolve the pubky-app image tags
        id: app_tag
        working-directory: pubky-app
        run: |
          # Content hash of every input the Docker build can consume; single
          # implementation shared with build-docker-image.yml (tag_mode: content).
          echo "content_tag=$(bash .github/scripts/docker-content-tag.sh '${{ env.platforms }}')" >> $GITHUB_OUTPUT
          # The wait step polls both tags so a commit-tag-only producer racing
          # the e2e build (a preview build of this same commit) can also
          # unblock the tests.
          echo "commit_tag=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      # The Cypress binary lives outside node_modules; cache it alongside so a hit
      # can skip `npm ci` (which is what downloads it) entirely.
      - name: Restore node_modules cache
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            pubky-app/node_modules
            ~/.cache/Cypress
          # `v1` is the cache format. `.npmrc` matches nothing until the file exists.
          key: e2e-node-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubky-app/.nvmrc', 'pubky-app/package.json', 'pubky-app/package-lock.json', 'pubky-app/.npmrc', 'pubky-app/patches/*.patch') }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'pubky-app/.nvmrc'
          cache: ${{ steps.node-modules.outputs.cache-hit != 'true' && 'npm' || '' }}
          cache-dependency-path: 'pubky-app/package-lock.json'

      # Fallback for a node_modules cache miss on a dependency bump: the binary
      # download is the bulk of npm ci, and the node_modules archive changes
      # with every lockfile edit. Key the binary on the resolved Cypress version
      # so an unrelated dependency update neither re-downloads nor re-archives
      # it. Skipped when the node_modules hit above already provides the binary.
      - name: Resolve the Cypress version
        if: steps.node-modules.outputs.cache-hit != 'true'
        id: cypress_version
        working-directory: pubky-app
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/cypress'].version")" >> $GITHUB_OUTPUT

      - name: Cache Cypress binary
        if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ steps.cypress_version.outputs.version }}

      - name: Install Cypress dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: pubky-app
        run: npm ci

      - name: Save node_modules cache
        if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            pubky-app/node_modules
            ~/.cache/Cypress
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - name: Login to registry
        uses: pubky/ci-workflows/.github/actions/docker/registry_login@main
        with:
          registry: ${{ env.registry }}
          gcp_service_account_key: ${{ secrets.GCR_JSON_KEY }}

      - name: Modify neo4j.env
        working-directory: pubky-stack/docker
        run: |
          sed -i 's/NEO4J_server_memory_pagecache_size=2G/NEO4J_server_memory_pagecache_size=1G/' neo4j.env
          sed -i 's/NEO4J_server_memory_heap_initial__size=4G/NEO4J_server_memory_heap_initial__size=1G/' neo4j.env
          sed -i 's/NEO4J_server_memory_heap_max__size=8G/NEO4J_server_memory_heap_max__size=2G/' neo4j.env

      - name: Increase watcher sleep in Nexus config
        working-directory: pubky-stack/docker
        run: |
          sed -i 's/watcher_sleep = 100/watcher_sleep = 500/' pubky-nexus-config-testnet.toml

      - name: Prepare pubky-stack .env
        working-directory: pubky-stack/docker
        run: |
          cp .env-sample .env
          printf '\nPUBKY_RUNTIME_SHOP_URL=%s\n' 'https://shop.staging.pubky.app/marketplace' >> .env
          # Poll Nexus more often than the 8888ms app defaults so specs do not sit on
          # multi-second notification/stream poll ticks between actions (E2E stack only).
          # The stream poll sits above the notification poll: at 2000ms the feed spec's
          # stream sync churn outweighed the saved poll ticks (feed Cypress regressed).
          printf '\nPUBKY_RUNTIME_NOTIFICATION_POLL_INTERVAL_MS=%s\n' '2000' >> .env
          printf '\nPUBKY_RUNTIME_STREAM_POLL_INTERVAL_MS=%s\n' '3000' >> .env
          # Guarantee the values reach the pubky-app container: the stack's compose file
          # may not pass through .env entries it does not list explicitly. Compose merges
          # docker-compose.override.yml automatically. Fail loudly rather than clobber an
          # override file if the stack ever ships one.
          if [ -f docker-compose.override.yml ]; then
            echo 'docker-compose.override.yml already exists in pubky-stack; merge the PUBKY_RUNTIME_* poll intervals into it instead of overwriting.'
            exit 1
          fi
          cat > docker-compose.override.yml <<'EOF'
          services:
            pubky-app:
              environment:
                PUBKY_RUNTIME_NOTIFICATION_POLL_INTERVAL_MS: "2000"
                PUBKY_RUNTIME_STREAM_POLL_INTERVAL_MS: "3000"
          EOF

      # pubky-stack@staging pins a homeserver that defaults to signup_mode = "open".
      # Open mode rejects signup token generation, so the invite continue button stays disabled.
      - name: Require signup tokens for e2e invite codes
        working-directory: pubky-stack/docker
        run: |
          sed -i 's/signup_mode = "open"/signup_mode = "token_required"/' homeserver.config.toml
          grep -q 'signup_mode = "token_required"' homeserver.config.toml || {
            echo 'Error: homeserver.config.toml is missing signup_mode = "token_required"'
            exit 1
          }

      # Start the infra services first; pubky-app follows once its image exists.
      # Compose interpolates every service at config load, so PUBKY_APP_TAG must be
      # set here even though the pubky-app service is not started in this step.
      - name: Run pubky-stack infra services
        working-directory: pubky-stack/docker
        run: docker compose up -d --no-build homeserver nexusd nexus-neo4j nexus-redis postgres
        env:
          REGISTRY: ${{ env.registry }}
          PUBKY_APP_TAG: ${{ steps.app_tag.outputs.content_tag }}

      - name: Wait for dockerised pubky-stack to start
        run: |
          PORT=8080
          MAX_WAIT=300     # Maximum wait time in seconds (5 minutes)
          WAIT_INTERVAL=5  # Interval between checks in seconds
          ELAPSED=0

          while ! curl -s http://localhost:$PORT; do
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "Service did not start within 5 minutes."
              exit 1
            fi
            echo "Waiting for service on port $PORT to be ready... ($ELAPSED seconds elapsed)"
            sleep $WAIT_INTERVAL
            ELAPSED=$((ELAPSED + WAIT_INTERVAL))
          done

          echo "Service is ready."

      - name: Wait for the pubky-app image
        id: wait_image
        env:
          REGISTRY: ${{ env.registry }}
          GH_TOKEN: ${{ github.token }}
          CONTENT_TAG: ${{ steps.app_tag.outputs.content_tag }}
          COMMIT_TAG: ${{ steps.app_tag.outputs.commit_tag }}
        run: |
          # Matches the build job's 20min timeout; the build-status check below
          # fails fast long before this cap when the build itself has failed.
          MAX_WAIT=1200   # Maximum wait time in seconds (20 minutes)
          INTERVAL=15
          ELAPSED=0
          DONE_GRACE=0
          IMAGE_BASE="$REGISTRY/pubky-app"

          # failed = a build job ended badly, done = every build job concluded
          # (image should exist), running = any still in progress, anything else
          # (including a transient API error) = keep waiting.
          build_jobs_state() {
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name | startswith("rebuild_pubky_app / ")) | .conclusion] | if any(. == "failure" or . == "cancelled" or . == "timed_out" or . == "startup_failure") then "failed" elif length == 0 or any(. == null) then "running" else "done" end' \
              2>/dev/null || echo "unknown"
          }

          # A tag existing is not enough: a manual arm64-only build can hold the
          # same commit tag. Only accept a tag whose manifest carries linux/amd64,
          # the platform this workflow builds and runs on. Covers both a manifest
          # index (.manifests[].platform.architecture) and a single manifest
          # (.architecture).
          has_amd64() {
            docker manifest inspect "$1" 2>/dev/null \
              | jq -e '[.. | objects | .architecture? // empty] | any(. == "amd64")' >/dev/null 2>&1
          }

          # Resolve and log the manifest digest so the exact tested image stays
          # identifiable even if a later build overwrites the tag.
          log_digest() {
            docker buildx imagetools inspect "$1" 2>/dev/null | awk '/^Digest:/ {print $2; found=1} END {if (!found) print "unknown"}'
          }

          while true; do
            if has_amd64 "$IMAGE_BASE:$CONTENT_TAG"; then
              echo "tag=$CONTENT_TAG" >> $GITHUB_OUTPUT
              echo "Image available: $IMAGE_BASE:$CONTENT_TAG@$(log_digest "$IMAGE_BASE:$CONTENT_TAG") (content tag, linux/amd64)"
              break
            fi
            if has_amd64 "$IMAGE_BASE:$COMMIT_TAG"; then
              # A commit-tag-only producer (a preview build of this commit racing
              # the e2e build) can unblock the tests minutes earlier.
              echo "tag=$COMMIT_TAG" >> $GITHUB_OUTPUT
              echo "Image available: $IMAGE_BASE:$COMMIT_TAG@$(log_digest "$IMAGE_BASE:$COMMIT_TAG") (commit tag, linux/amd64)"
              break
            fi

            STATE=$(build_jobs_state)
            if [ "$STATE" = "failed" ]; then
              echo "The pubky-app build failed; not waiting for an image that will never arrive."
              exit 1
            fi
            if [ "$STATE" = "done" ]; then
              DONE_GRACE=$((DONE_GRACE + 1))
              if [ $DONE_GRACE -ge 4 ]; then
                echo "The pubky-app build finished successfully but neither $IMAGE_BASE:$CONTENT_TAG nor :$COMMIT_TAG exists in the registry."
                exit 1
              fi
            fi

            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "pubky-app image did not appear within $((MAX_WAIT / 60)) minutes."
              exit 1
            fi
            echo "Waiting for the pubky-app image... ($ELAPSED seconds elapsed)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

      - name: Run pubky-app
        working-directory: pubky-stack/docker
        run: docker compose up -d --no-build pubky-app
        env:
          REGISTRY: ${{ env.registry }}
          PUBKY_APP_TAG: ${{ steps.wait_image.outputs.tag }}

      - name: Run e2e tests - Desktop (${{ matrix.browser }}) - Spec (${{matrix.spec}})
        id: test-desktop
        uses: cypress-io/github-action@v7
        env:
          DEBUG: '@cypress/github-action'
        with:
          working-directory: pubky-app/cypress
          config-file: cypress.config.ts
          spec: e2e/${{ matrix.spec }}
          browser: ${{ matrix.browser }}
          headed: false
          summary-title: ${{ matrix.browser }} - Desktop
          install: false
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 180

      - name: Upload screenshots - ${{ matrix.browser }} - Desktop
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.browser }}-${{ matrix.spec }}-desktop
          path: pubky-app/cypress/screenshots
          if-no-files-found: ignore

      - name: Upload video for ${{ matrix.spec }} test - ${{ matrix.browser }} - Desktop
        if: always() && steps.test-desktop.outcome == 'failure'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: video-${{ matrix.browser }}-${{ matrix.spec }}-desktop-onboarding
          path: pubky-app/cypress/videos/${{ matrix.spec }}.mp4
          if-no-files-found: ignore

      # TODO: Skipped due to bug https://github.com/pubky/pubky-app/issues/372
      # - name: Run e2e tests - Mobile (${{ matrix.browser }})
      #   id: test-mobile
      #   uses: cypress-io/github-action@v7
      #   env:
      #     DEBUG: '@cypress/github-action'
      #   with:
      #     working-directory: pubky-app/cypress
      #     config-file: cypress.config.mobile.ts
      #     spec: e2e/**/*.cy.ts
      #     browser: ${{ matrix.browser }}
      #     headed: false
      #     summary-title: ${{ matrix.browser }} - Mobile
      #     install: false
      #     # no need to start the server, it's already running
      #     wait-on: 'http://localhost:3000'
      #     wait-on-timeout: 180

      - name: Upload screenshots - ${{ matrix.browser }} - Mobile
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.browser }}-${{ matrix.spec }}-mobile
          path: pubky-app/cypress/screenshots/mobile
          if-no-files-found: ignore

      - name: Upload video for ${{ matrix.spec }} test - ${{ matrix.browser }} - Mobile
        if: always() && steps.test-mobile.outcome == 'failure'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: video-${{ matrix.browser }}-${{ matrix.spec }}-mobile-onboarding
          path: pubky-app/cypress/videos/mobile/${{ matrix.spec }}.mp4
          if-no-files-found: ignore

      - name: Upload cypress.log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: cypress-log-${{ matrix.browser }}-${{ matrix.spec }}
          path: pubky-app/cypress/cypress.log
          if-no-files-found: ignore

      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v2
