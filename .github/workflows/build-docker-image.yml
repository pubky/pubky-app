name: Build Pubky Docker Image

on:
  workflow_dispatch:
    inputs:
      latest:
        description: 'Use latest tag'
        required: false
        default: false
        type: boolean

      platforms:
        description: 'Platforms'
        required: true
        type: choice
        options:
          - linux/arm64/v8
          - linux/arm64/v7
          - linux/arm64
          - linux/amd64

      pr_number:
        description: 'PR number (used for preview env)'
        required: false
        type: string

      commit_sha:
        description: 'Commit SHA to checkout'
        required: false
        type: string

  workflow_call:
    outputs:
      image_tag:
        description: 'Image tag'
        value: ${{ jobs.check_image.outputs.image_tag }}
      image_name:
        description: 'Image name used for the build'
        value: ${{ jobs.check_image.outputs.image_name }}
    inputs:
      latest:
        description: 'Use latest tag'
        required: false
        default: false
        type: boolean

      platforms:
        required: true
        type: string

      pr_number:
        description: 'PR number (used for preview env)'
        required: false
        type: string

      commit_sha:
        description: 'Commit SHA to checkout'
        required: false
        type: string

env:
  registry: 'europe-west6-docker.pkg.dev/infra-464608/synonym-private-repo'

jobs:
  check_image:
    name: Validate and rebuild Pubky App
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
      image_name: ${{ steps.set_tag.outputs.image_name }}
      image_exists: ${{ steps.check_image.outputs.exists }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Set HEAD commit hash
        id: sha_tag
        uses: pubky/ci-workflows/.github/actions/docker/get_head_commit_hash@main
        with:
          path: '.'

      - name: Set Current Tag as Output
        id: set_tag
        run: |
          echo image_tag=${{ steps.sha_tag.outputs.hash }} >> $GITHUB_OUTPUT
          echo image_name=pubky-app >> $GITHUB_OUTPUT

      - name: Login to registry
        uses: pubky/ci-workflows/.github/actions/docker/registry_login@main
        with:
          registry: ${{ env.registry }}
          gcp_service_account_key: ${{ secrets.GCR_JSON_KEY }}

      - name: Check if image needs to be rebuild
        uses: pubky/ci-workflows/.github/actions/docker/check_if_image_exists@main
        id: check_image
        with:
          image: ${{ env.registry }}/${{ steps.set_tag.outputs.image_name }}
          tag: ${{ steps.sha_tag.outputs.hash }}
          arch: ${{ inputs.platforms }}

  build_image:
    name: Build and push image
    needs: [check_image]
    if: ${{ needs.check_image.outputs.image_exists != 'true' }}
    runs-on: ['ubuntu-latest']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Login to registry
        uses: pubky/ci-workflows/.github/actions/docker/registry_login@main
        with:
          registry: ${{ env.registry }}
          gcp_service_account_key: ${{ secrets.GCR_JSON_KEY }}

      - name: Load Docker build args
        id: docker_build_args
        run: |
          {
            echo 'build_args<<EOF'
            sed '/^[[:space:]]*#/d;/^[[:space:]]*$/d' .github/docker-build-args.env
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image pubky-app
        uses: pubky/ci-workflows/.github/actions/docker/build_and_push@main
        with:
          image: 'pubky-app'
          context: '.'
          registry: ${{ env.registry }}
          platforms: ${{ inputs.platforms }}
          latest: ${{ inputs.latest }}
          # NOTE: network values (NEXUS_URL, CDN_URL, HOMESERVER, HOMESERVER_URL, HOMEGATE_URL,
          # DEFAULT_HTTP_RELAY, PKARR_RELAYS, TESTNET) and Sentry values (SENTRY_DSN,
          # SENTRY_ENVIRONMENT, SENTRY_*_SAMPLE_RATE) are intentionally NOT build args. They are
          # supplied at container runtime as PUBKY_RUNTIME_* (see Dockerfile and
          # src/libs/runtime-config). Source-map upload happens in the CI pipeline via sentry-cli,
          # never during the image build, so no Sentry credentials are needed here.
          build_args: ${{ steps.docker_build_args.outputs.build_args }}

      - name: Upload Sentry source maps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: synonym-52
          SENTRY_PROJECT: pubky-app
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN is not available; skipping source-map upload."
            exit 0
          fi

          if [ "${{ inputs.platforms }}" != "linux/amd64" ]; then
            echo "Source-map upload currently supports linux/amd64 only; skipping for ${{ inputs.platforms }}."
            exit 0
          fi

          RELEASE="$(node -p "require('./package.json').version")"
          rm -rf .sentry-builder
          mapfile -t DOCKER_BUILD_ARGS < <(
            sed '/^[[:space:]]*#/d;/^[[:space:]]*$/d;s/^/--build-arg=/' .github/docker-build-args.env
          )

          docker buildx build \
            --target builder \
            --platform "${{ inputs.platforms }}" \
            --cache-from "type=registry,ref=${{ env.registry }}/${{ needs.check_image.outputs.image_name }}:cache" \
            --output "type=local,dest=.sentry-builder" \
            "${DOCKER_BUILD_ARGS[@]}" \
            .

          npx --yes @sentry/cli sourcemaps upload .sentry-builder/app/.next \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --release "$RELEASE"
