name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number (use 9999 for testing)'
        required: true
        default: '9999'
      action:
        description: 'Action'
        required: true
        type: choice
        options:
          - deploy
          - cleanup

env:
  REGISTRY: europe-west6-docker.pkg.dev/infra-464608/synonym-private-repo
  REGION: europe-west6
  PROJECT_ID: infra-464608
  # Every PR preview is a tagged revision of this one Cloud Run service. The
  # load balancer for *.preview.pubky.app routes <tag>.preview.pubky.app to
  # the revision tagged <tag>, so PR 123 is served at pr-123.preview.pubky.app.
  PREVIEW_SERVICE: pubky-preview
  PREVIEW_DOMAIN: preview.pubky.app

concurrency:
  group: preview-${{ github.event.pull_request.number || github.event.inputs.pr_number || '0' }}
  cancel-in-progress: true

jobs:
  set-vars:
    name: Set Variables
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.vars.outputs.pr_number }}
      tag: ${{ steps.vars.outputs.tag }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
      platforms: ${{ steps.vars.outputs.platforms }}
    steps:
      - name: Set variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          else
            COMMIT_SHA="${{ github.sha }}"
          fi
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "tag=pr-${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo ${COMMIT_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "platforms=linux/amd64" >> $GITHUB_OUTPUT

  build-preview:
    name: Build Preview Image
    needs: [set-vars]
    uses: ./.github/workflows/build-docker-image.yml
    with:
      platforms: ${{ needs.set-vars.outputs.platforms }}
      pr_number: ${{ needs.set-vars.outputs.pr_number }}
      commit_sha: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit

  deploy-preview:
    name: Deploy Preview
    needs: [set-vars, build-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7
        with:
          # Blobless partial clone. The negation drops only VRT baseline PNGs
          # under src/test/vrt/**/__screenshots__. This job only edits the
          # Cloud Run service file.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/src/test/vrt/**/__screenshots__

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.CLOUD_RUN_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy tagged revision
        id: deploy
        env:
          IMAGE_FULL_PATH: ${{ env.REGISTRY }}/${{ needs.build-preview.outputs.image_name }}:${{ needs.build-preview.outputs.image_tag }}
          PR_NUMBER: ${{ needs.set-vars.outputs.pr_number }}
          TAG: ${{ needs.set-vars.outputs.tag }}
          # Unique per run so a re-run never collides with an existing revision.
          REVISION: ${{ env.PREVIEW_SERVICE }}-${{ needs.set-vars.outputs.tag }}-${{ needs.set-vars.outputs.short_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          yq -i '.metadata.name = strenv(PREVIEW_SERVICE)' preview-deploy-service-file.yml
          yq -i '.spec.template.metadata.name = strenv(REVISION)' preview-deploy-service-file.yml
          yq -i '.spec.template.metadata.labels["pr-number"] = strenv(PR_NUMBER)' preview-deploy-service-file.yml
          yq -i '.spec.template.spec.containers[1].image = strenv(IMAGE_FULL_PATH)' preview-deploy-service-file.yml

          # `services replace` rewrites the whole traffic list, so copy the other
          # PRs' tags from the live service and point this PR's tag at the new
          # revision. The new revision also takes the base traffic (unused by
          # previews) so every older revision can be deleted.
          gcloud run services describe "$PREVIEW_SERVICE" --region "$REGION" --format=json > current.json 2>/dev/null || echo '{}' > current.json
          jq --arg tag "$TAG" --arg rev "$REVISION" \
            '[(.spec.traffic // [])[] | select(.tag != null and .tag != $tag) | .percent = 0]
             + [{revisionName: $rev, tag: $tag, percent: 100}]' current.json > traffic.json
          yq -i '.spec.traffic = load("traffic.json")' preview-deploy-service-file.yml

          gcloud run services replace preview-deploy-service-file.yml --region "$REGION"

          # Drop this PR's earlier revisions.
          gcloud run revisions list --service "$PREVIEW_SERVICE" --region "$REGION" \
            --filter="metadata.labels.pr-number=$PR_NUMBER AND metadata.name!=$REVISION" \
            --format='value(metadata.name)' | while read -r rev; do
              gcloud run revisions delete "$rev" --region "$REGION" --quiet || true
            done

          echo "url=https://${TAG}.${PREVIEW_DOMAIN}" >> "$GITHUB_OUTPUT"

      - name: Find existing comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '🚀 Preview'

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## 🚀 Preview Deployment

            **URL:** ${{ steps.deploy.outputs.url }}

            `${{ needs.set-vars.outputs.tag }}` • `${{ needs.set-vars.outputs.short_sha }}`


  cleanup-preview:
    name: Cleanup Preview
    if: |
      (github.event_name == 'pull_request_target' && github.event.action == 'closed') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'cleanup')
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "tag=pr-${PR_NUMBER}" >> $GITHUB_OUTPUT

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.CLOUD_RUN_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Remove preview tag and revisions
        env:
          PR_NUMBER: ${{ steps.vars.outputs.pr_number }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          gcloud run services update-traffic "$PREVIEW_SERVICE" \
            --region="$REGION" --remove-tags="$TAG" --quiet || true
          # A revision still holding base traffic cannot be deleted and is kept.
          gcloud run revisions list --service "$PREVIEW_SERVICE" --region "$REGION" \
            --filter="metadata.labels.pr-number=$PR_NUMBER" \
            --format='value(metadata.name)' | while read -r rev; do
              gcloud run revisions delete "$rev" --region "$REGION" --quiet || true
            done
          # PRs deployed before the shared service still have their own service.
          gcloud run services delete "pubky-app-pr-${PR_NUMBER}" \
            --region="$REGION" --quiet || true
