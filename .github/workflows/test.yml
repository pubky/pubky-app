name: Tests

on:
  merge_group:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - '**' # Run on PRs targeting any branch
  # Enable manual trigger
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # Pull requests into dev run only the unit tests their change can affect; the merge
  # queue (merge_group), push, workflow_dispatch and PRs into any other branch run the
  # full suite. Anything landing through the merge queue has passed the full suite on
  # the merged tree. An admin bypass merge skips the merge_group run and lands on the
  # affected subset alone; that is accepted because the push to dev runs the full
  # suite right after.
  # See .github/scripts/plan-unit-tests.sh for the rules.
  plan:
    name: Plan unit tests
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      shards: ${{ steps.plan.outputs.shards }}
      shard_total: ${{ steps.plan.outputs.shard_total }}
      files: ${{ steps.plan.outputs.files }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Depth 2: a pull_request checkout is the merge commit, and HEAD^1 is the base
          # it is diffed against.
          fetch-depth: 2
          # Blobless partial clone. The negation drops only VRT baseline PNGs
          # under src/test/vrt/**/__screenshots__. VRT workflows still fetch them.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/src/test/vrt/**/__screenshots__

      # Only a pull_request plan runs Vitest; every other event plans full straight away.
      - name: Install dependencies
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/install-dependencies

      - name: Plan
        id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
          # Repository variable; set it to `full` to switch selection off everywhere.
          UNIT_TEST_SELECTION: ${{ vars.UNIT_TEST_SELECTION }}
        run: bash .github/scripts/plan-unit-tests.sh

  test:
    name: Run Shard Tests
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Blobless partial clone. The negation drops only VRT baseline PNGs
          # under src/test/vrt/**/__screenshots__. VRT workflows still fetch them.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/src/test/vrt/**/__screenshots__

      # Same lockfile install (npm ci, cached node_modules) as Build and Code Quality.
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run Vitest Shard ${{ matrix.shard }}
        env:
          VITEST_MAX_WORKERS: 4
          MODE: ${{ needs.plan.outputs.mode }}
          FILES: ${{ needs.plan.outputs.files }}
          SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.shard_total }}
        run: |
          if [ "$MODE" = full ]; then
            # Raw `json` coverage per shard; merge-coverage combines them.
            npx vitest run --project unit --coverage --coverage.reporter=json --shard="$SHARD" --pool=forks
          else
            # A subset's coverage would read as a coverage drop, so affected runs skip it.
            files=()
            while IFS= read -r file; do files+=("$file"); done < <(jq -r '.[]' <<< "$FILES")
            # Without filters Vitest would run everything; an empty list is a planner bug.
            if [ "${#files[@]}" -eq 0 ]; then
              echo "The plan is '$MODE' but lists no test files." >&2
              exit 1
            fi
            npx vitest run --project unit --shard="$SHARD" --pool=forks "${files[@]}"
          fi

      - name: Rename coverage file
        if: always() && needs.plan.outputs.mode == 'full'
        # 2. Rename the file so the shards don't overwrite each other when downloaded
        run: mv coverage/coverage-final.json coverage/coverage-${{ matrix.shard }}.json

      - name: Upload partial coverage
        if: always() && needs.plan.outputs.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/coverage-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 1 # We only need this temporarily for the merge job

  merge-coverage:
    name: Merge Coverage Reports
    needs: [plan, test] # 3. Wait for all test shards to complete
    runs-on: ubuntu-latest
    if: always() && needs.plan.outputs.mode == 'full'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Blobless partial clone. The negation drops only VRT baseline PNGs
          # under src/test/vrt/**/__screenshots__. VRT workflows still fetch them.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/src/test/vrt/**/__screenshots__

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: .nyc_output # 4. Download directly into nyc's default input folder
          merge-multiple: true

      - name: Merge coverage and generate final report
        # 5. Read the .nyc_output folder and generate standard unified reports
        run: npx nyc report --reporter=lcov --reporter=html --reporter=text-summary

      - name: Upload Final Coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-final
          path: coverage/ # Contains your unified lcov.info and html reports
          retention-days: 30

  test-status:
    name: Run Tests
    needs: [plan, test]
    if: always() # Runs even if the plan or a shard fails or is skipped
    runs-on: ubuntu-latest
    steps:
      - name: Check test status
        env:
          PLAN: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          TEST: ${{ needs.test.result }}
        run: |
          if [ "$PLAN" != success ]; then
            echo "The unit test plan did not complete ($PLAN)."
            exit 1
          fi
          if [ "$MODE" = none ] && [ "$TEST" = skipped ]; then
            echo "No unit test can be affected by this change."
            exit 0
          fi
          if [ "$TEST" != success ]; then
            echo "One or more test shards did not pass ($TEST)."
            exit 1
          fi
          echo "All $MODE unit test shards passed."
