name: Visual Regression Tests

on:
  push:
    branches:
      - master
      - dev
  # Enable manual trigger
  workflow_dispatch:

jobs:
  vrt:
    name: VRT (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    concurrency:
      group: vrt-${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check VRT screenshot folders have sibling tests
        run: bash src/test-utils/vrt.screenshot-siblings.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set Playwright browsers path
        run: echo "PLAYWRIGHT_BROWSERS_PATH=${HOME}/.cache/ms-playwright" >> "$GITHUB_ENV"

      - name: Restore Playwright browsers cache
        uses: actions/cache/restore@v4
        id: playwright-browsers-cache
        with:
          path: ~/.cache/ms-playwright
          key: vrt-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            vrt-playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-browsers-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      # On a cache hit the browser binaries are restored, but because Ubuntu runners
      # are ephemeral, apt libraries installed by --with-deps are not persisted.
      # Run install-deps only (no re-download) so headless launches still work on Linux.
      - name: Install Playwright system dependencies
        if: steps.playwright-browsers-cache.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: npx playwright install-deps chromium firefox webkit

      - name: Run visual regression tests
        run: npm run test:vrt

      # Save even when VRT fails
      - name: Save Playwright browsers cache
        if: always() && steps.playwright-browsers-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-browsers-cache.outputs.cache-primary-key }}

      - name: Upload VRT failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-failures-${{ matrix.os }}
          path: .vitest-attachments/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
