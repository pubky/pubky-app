name: Build

on:
  merge_group:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - '**' # Run on PRs targeting any branch
  # Enable manual trigger
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check NextJS Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Blobless partial clone. The negation drops only VRT baseline PNGs
          # under src/test/vrt/**/__screenshots__. VRT workflows still fetch them.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/src/test/vrt/**/__screenshots__

      # Fails the build if the sparse pattern drops a shipped asset or a
      # non-baseline test image, or if it fails to exclude the VRT PNGs.
      - name: Check non-baseline files survived checkout
        run: |
          missing=0
          for path in \
            public/manifest.json \
            public/franky.png \
            public/pubky-logo.svg \
            public/images/manifest/web-app-manifest-512x512.png \
            src/test/vrt/images/vrt-golden-hour.webp \
            src/test/vrt/feed/Home.vrt.test.tsx \
            cypress/fixtures/mustache-you.png
          do
            if [ ! -e "$path" ]; then
              echo "Sparse checkout dropped a non-baseline file: $path"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if find src/test/vrt -path '*/__screenshots__/*.png' | grep -q .; then
            echo "Sparse checkout included VRT baseline screenshots."
            exit 1
          fi
          git count-objects -vH

      # Clean install on purpose: this job is the proof that the production build
      # works with no Actions cache, no npm download cache and no Next.js build cache.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build prod
        run: npm run build

      - name: Smoke test production server
        run: |
          SERVER_LOG="$(mktemp)"

          #PUBKY runtime variables
          export PUBKY_RUNTIME_ENV="staging"
          export PUBKY_RUNTIME_SHOP_URL="https://shop.staging.pubky.app/marketplace"
          export PUBKY_RUNTIME_TESTNET="false"
          export PUBKY_RUNTIME_HOMESERVER="ufibwbmed6jeq9k4p583go95wofakh9fwpp4k734trq79pd9u1uy"
          export PUBKY_RUNTIME_HOMESERVER_URL="https://homeserver.staging.pubky.app"
          export PUBKY_RUNTIME_NEXUS_URL="https://nexus.staging.pubky.app"
          export PUBKY_RUNTIME_CDN_URL="https://nexus.staging.pubky.app/static"
          export PUBKY_RUNTIME_HOMEGATE_URL="https://homegate.staging.pubky.app"
          export PUBKY_RUNTIME_PKARR_RELAYS='["https://pkarr.pubky.app","https://pkarr.pubky.org"]'
          export PUBKY_RUNTIME_DEFAULT_HTTP_RELAY="https://httprelay.staging.pubky.app/inbox"

          npm run start > "$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          PORT=3000
          MAX_WAIT=120
          WAIT_INTERVAL=2
          ELAPSED=0

          while ! curl -fsS "http://localhost:${PORT}/" > /dev/null; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Production server exited unexpectedly (PID ${SERVER_PID})."
              echo "--- server log ---"
              cat "$SERVER_LOG"
              exit 1
            fi
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "Production server did not become ready within ${MAX_WAIT}s."
              echo "--- server log ---"
              cat "$SERVER_LOG"
              exit 1
            fi
            echo "Waiting for http://localhost:${PORT}/ ... (${ELAPSED}s)"
            sleep $WAIT_INTERVAL
            ELAPSED=$((ELAPSED + WAIT_INTERVAL))
          done

          echo "Production server is ready."
