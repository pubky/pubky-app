name: Build

on:
  merge_group:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - '**' # Run on PRs targeting any branch
  # Enable manual trigger
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check NextJS Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Blobless partial clone. The negation drops only VRT baseline PNGs
          # under src/test/vrt/**/__screenshots__. VRT workflows still fetch them.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/src/test/vrt/**/__screenshots__

      # Clean install on purpose: this job is the proof that the production build
      # works with no Actions cache, no npm download cache and no Next.js build cache.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        # The build never runs Cypress; type-checking cypress/ only needs the package.
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Build prod
        run: npm run build

      - name: Smoke test production server
        run: |
          SERVER_LOG="$(mktemp)"

          #PUBKY runtime variables
          export PUBKY_RUNTIME_ENV="staging"
          export PUBKY_RUNTIME_SHOP_URL="https://shop.staging.pubky.app/marketplace"
          export PUBKY_RUNTIME_TESTNET="false"
          export PUBKY_RUNTIME_HOMESERVER="ufibwbmed6jeq9k4p583go95wofakh9fwpp4k734trq79pd9u1uy"
          export PUBKY_RUNTIME_HOMESERVER_URL="https://homeserver.staging.pubky.app"
          export PUBKY_RUNTIME_NEXUS_URL="https://nexus.staging.pubky.app"
          export PUBKY_RUNTIME_CDN_URL="https://nexus.staging.pubky.app/static"
          export PUBKY_RUNTIME_HOMEGATE_URL="https://homegate.staging.pubky.app"
          export PUBKY_RUNTIME_PKARR_RELAYS='["https://pkarr.pubky.app","https://pkarr.pubky.org"]'
          export PUBKY_RUNTIME_DEFAULT_HTTP_RELAY="https://httprelay.staging.pubky.app/inbox"

          npm run start > "$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          PORT=3000
          MAX_WAIT=120
          WAIT_INTERVAL=2
          ELAPSED=0

          while ! curl -fsS "http://localhost:${PORT}/" > /dev/null; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Production server exited unexpectedly (PID ${SERVER_PID})."
              echo "--- server log ---"
              cat "$SERVER_LOG"
              exit 1
            fi
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "Production server did not become ready within ${MAX_WAIT}s."
              echo "--- server log ---"
              cat "$SERVER_LOG"
              exit 1
            fi
            echo "Waiting for http://localhost:${PORT}/ ... (${ELAPSED}s)"
            sleep $WAIT_INTERVAL
            ELAPSED=$((ELAPSED + WAIT_INTERVAL))
          done

          echo "Production server is ready."

          # Hard loads of every route shape, dynamic ones included: client navigation never asks the
          # server for these, so a page that fails only on a direct request shows up here.
          KEY="oj5irox6fpf3qgjau8wkwx8irpyyapoy75dmd14obb7z8pmnxd9y"
          FAILED=0
          for ROUTE in / /home /hot /search?q=pubky /settings/account /collections \
            "/profile/${KEY}" "/profile/${KEY}/followers" "/post/${KEY}/003625JK4263R" \
            "/collections/${KEY}/003625JK4263R" /feed/feed-abc123 /invite/abcd-efgh-ijkl; do
            BODY="$(mktemp)"
            STATUS="$(curl -sS -o "$BODY" -w '%{http_code}' "http://localhost:${PORT}${ROUTE}")"
            if [ "$STATUS" != "200" ] || grep -q 'Internal Server Error\|Application error' "$BODY"; then
              echo "FAIL ${ROUTE}: HTTP ${STATUS}"
              FAILED=1
            else
              echo "ok   ${ROUTE}"
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "--- server log ---"
            cat "$SERVER_LOG"
            exit 1
          fi
