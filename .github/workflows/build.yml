name: Build

on:
  merge_group:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - '**' # Run on PRs targeting any branch
  # Enable manual trigger
  workflow_dispatch:

jobs:
  build:
    name: Check NextJS Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-nextjs-v1-${{ hashFiles('.nvmrc', 'package.json', 'package-lock.json', 'next.config.ts', 'serwist.config.mjs', 'tsconfig.json', 'postcss.config.mjs') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nextjs-v1-${{ hashFiles('.nvmrc', 'package.json', 'package-lock.json', 'next.config.ts', 'serwist.config.mjs', 'tsconfig.json', 'postcss.config.mjs') }}-

      - name: Build prod
        run: npm run build

      # Save only from dev/master pushes. Pull-request and merge-queue caches are scoped to refs that
      # other runs cannot restore, and each ~420 MB entry would evict other workflows' caches. Those
      # runs still restore the newest dev entry through the restore-keys prefix.
      - name: Save Next.js build cache
        if: github.event_name == 'push' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

      - name: Smoke test production server
        run: |
          SERVER_LOG="$(mktemp)"

          #PUBKY runtime variables
          export PUBKY_RUNTIME_ENV="staging"
          export PUBKY_RUNTIME_TESTNET="false"
          export PUBKY_RUNTIME_HOMESERVER="ufibwbmed6jeq9k4p583go95wofakh9fwpp4k734trq79pd9u1uy"
          export PUBKY_RUNTIME_HOMESERVER_URL="https://homeserver.staging.pubky.app"
          export PUBKY_RUNTIME_NEXUS_URL="https://nexus.staging.pubky.app"
          export PUBKY_RUNTIME_CDN_URL="https://nexus.staging.pubky.app/static"
          export PUBKY_RUNTIME_HOMEGATE_URL="https://homegate.staging.pubky.app"
          export PUBKY_RUNTIME_PKARR_RELAYS='["https://pkarr.pubky.app","https://pkarr.pubky.org"]'
          export PUBKY_RUNTIME_DEFAULT_HTTP_RELAY="https://httprelay.staging.pubky.app/inbox"

          npm run start > "$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          PORT=3000
          MAX_WAIT=120
          WAIT_INTERVAL=2
          ELAPSED=0

          while ! curl -fsS "http://localhost:${PORT}/" > /dev/null; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Production server exited unexpectedly (PID ${SERVER_PID})."
              echo "--- server log ---"
              cat "$SERVER_LOG"
              exit 1
            fi
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "Production server did not become ready within ${MAX_WAIT}s."
              echo "--- server log ---"
              cat "$SERVER_LOG"
              exit 1
            fi
            echo "Waiting for http://localhost:${PORT}/ ... (${ELAPSED}s)"
            sleep $WAIT_INTERVAL
            ELAPSED=$((ELAPSED + WAIT_INTERVAL))
          done

          echo "Production server is ready."
          # A catch-all HTML response can also return 200; verify the actual worker bytes.
          test -s public/sw.js
          curl -fsS "http://localhost:${PORT}/sw.js" | cmp public/sw.js -
          # The precache must cover the whole build (Serwist only warns when it drops a file) and every
          # entry must be served as built, or the worker install fails or caches the wrong response.
          node tooling/sw/verify-precache.mjs "http://localhost:${PORT}"
