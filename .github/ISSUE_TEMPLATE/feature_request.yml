name: Feature Request
description: Suggest a new feature or improvement
title: '[Feature]: '
labels: ['📈 enhancement']
type: feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! 🚀

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: |
        As a user, I want to [do something] so that [benefit].
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: |
        Describe what you'd like to happen. Include links to design (Figma, mockups, etc.) if you have them.
      placeholder: |
        I would like...
        
        Design: [link to Figma, sketch, or similar]
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Suggested Priority
      description: How important is this feature to you?
      options:
        - Nice to have (would be cool)
        - Important (would use frequently)
        - Critical (can't use app effectively without it)
    validations:
      required: false
