apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: SHOULD_BE_CHANGED
  labels:
    cloud.googleapis.com/location: europe-west6
    run.googleapis.com/satisfiesPzs: 'true'
    managed-by: github-actions
  annotations:
    run.googleapis.com/invoker-iam-disabled: 'true'
    run.googleapis.com/iap-enabled: 'true'

spec:
  template:
    metadata:
      labels:
        run.googleapis.com/startupProbeType: Default
      annotations:
        autoscaling.knative.dev/maxScale: '2'
        run.googleapis.com/container-dependencies: '{"nginx":["pubky-app"]}'
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/startup-cpu-boost: 'true'
        run.googleapis.com/sessionAffinity: 'true'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - name: nginx
          image: >-
            europe-west6-docker.pkg.dev/infra-464608/synonym-private-repo/nginx-normilizer:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            timeoutSeconds: 240
            periodSeconds: 240
            failureThreshold: 1
            tcpSocket:
              port: 8080
        - name: pubky-app
          image: SHOULD_BE_UPDATED
          env:
            # Temporary: this preview talks to the production stack (values from
            # pubky-stack .github/workflows/pubky-app-cicd.yml, production branch).
            # Do not merge: it would point every later PR preview at production.
            - name: PUBKY_RUNTIME_ENV
              value: "production"
            - name: PUBKY_RUNTIME_TESTNET
              value: "false"
            - name: PUBKY_RUNTIME_HOMESERVER
              value: "8um71us3fyw6h8wbcxb5ar3rwusy1a6u49956ikzojg3gcwd1dty"
            - name: PUBKY_RUNTIME_HOMESERVER_URL
              value: "https://homeserver.pubky.app"
            - name: PUBKY_RUNTIME_NEXUS_URL
              value: "https://nexus.pubky.app"
            - name: PUBKY_RUNTIME_CDN_URL
              value: "https://nexus.pubky.app/static"
            - name: PUBKY_RUNTIME_HOMEGATE_URL
              value: "https://homegate.pubky.app"
            - name: PUBKY_RUNTIME_PKARR_RELAYS
              value: '["https://pkarr.pubky.app","https://pkarr.pubky.org"]'
            - name: PUBKY_RUNTIME_DEFAULT_HTTP_RELAY
              value: "https://httprelay.pubky.app/inbox"
            - name: PUBKY_RUNTIME_LOCK_SERVER
              value: "txoxu5o9txz73mp9hxcfnign6sgqx9ngf66hrhtr49a1g7spc8mo"
            - name: PUBKY_RUNTIME_PAYKIT_SERVER_URL
              value: "https://paykit.pubky.app"
            # Pubky Passport ("Continue with Google") signer for the production homeserver above.
            # Optional tier: unset disables the feature. Previews are HTTPS, so the hand-off works.
            - name: PUBKY_RUNTIME_PASSPORT_URL
              value: "https://passport.pubky.app"
            - name: PUBKY_RUNTIME_MODERATION_ID
              value: "euarj183st16psbzusb44usk8i1k5foubnw7zt3n3j8h9zxg6hro"
            # Optional Sentry tier (DSNs are public client-side values, not secrets).
            # Mirrors the GitHub `SENTRY_DSN` repo variable.
            - name: PUBKY_RUNTIME_SENTRY_DSN
              value: "https://eba463f14570a9ce3b3bd831d3d7fa34@o4510935258234880.ingest.de.sentry.io/4510935265640528"
            - name: PUBKY_RUNTIME_SENTRY_ENVIRONMENT
              value: "preview"
            - name: PUBKY_RUNTIME_SENTRY_TRACES_SAMPLE_RATE
              value: "0.5"
            - name: PUBKY_RUNTIME_SENTRY_REPLAYS_SESSION_SAMPLE_RATE
              value: "0.1"
            - name: PUBKY_RUNTIME_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE
              value: "1.0"
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            timeoutSeconds: 240
            periodSeconds: 240
            failureThreshold: 1
            tcpSocket:
              port: 3000
